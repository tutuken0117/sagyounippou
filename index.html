  const colT={}; let g=0;
  used.forEach(id=>{ staff.forEach(s=>{ const v=(m[id]||{})[s.id]||0; colT[s.id]=(colT[s.id]||0)+v; g+=v; }); });
  const n=Math.max(1,staff.length);
  const perStaff=Math.min(18, Math.max(12, (281-14-52)/n));   // 氏名は横書きなので、無理なく収まる幅を人数に応じて調整
  const nameW=Math.max(46, 281-14-perStaff*n);
  const pages=chunk(used, SITE_ROWS_PER_PAGE);
  return pages.map((ids,pi)=>{
    let h=`<div class="psheet">`+pHeadHTML('現 場 別 集 計 表',
      pages.length>1?`<div class="who"><span>頁</span>${pi+1}/${pages.length}</div>`:'');
    h+=`<table class="pt"><colgroup><col style="width:${nameW}mm">${staff.map(()=>`<col style="width:${perStaff.toFixed(1)}mm">`).join('')}<col style="width:14mm"></colgroup>
      <thead><tr><th>現　場　名</th>${staff.map(s=>`<th>${esc(s.name)}</th>`).join('')}<th>計</th></tr></thead><tbody>`;
    ids.forEach(id=>{
      let rt=0; h+=`<tr><td class="l">${esc(siteName(id))}</td>`;
      staff.forEach(s=>{ const v=(m[id]||{})[s.id]||0; rt+=v; h+=`<td class="${v?'':'z'}">${fx(v)||''}</td>`; });
      h+=`<td style="font-weight:700">${fx(rt)}</td></tr>`;
    });
    if(!ids.length) h+=`<tr><td class="l">（実績なし）</td>${staff.map(()=>'<td></td>').join('')}<td></td></tr>`;
    if(pi===pages.length-1)
      h+=`</tbody><tfoot><tr><td>合　計</td>${staff.map(s=>`<td>${fx(colT[s.id])||''}</td>`).join('')}<td>${fx(g)}</td></tr></tfoot></table>`;

  /* 実績のない人は帳票に出さない（白紙のページが出ないように） */
  const targets = staffForMonth(mk).filter(s=> monthCalc(s.id,mk).total.total>0 || live('day').some(d=>d.staffId===s.id&&d.date.slice(0,7)===mk));
  if(kind==='daily') html = targets.map(s=>sheetDaily(s.id)).join('') || '<div class="empty">対象者がいません</div>';
  else if(kind==='daily1') html = sheetDaily($('#pStaff').value||UI.staffId);
  else if(kind==='site') html = sheetSiteMatrix();
  else if(kind==='staff') html = sheetStaffMatrix();
  else html = targets.map(s=>sheetDaily(s.id)).join('') + sheetSiteMatrix() + sheetStaffMatrix();
  $('#printarea').innerHTML=html;
  const n=$$('#printarea .psheet').length;
  $('#pHint').textContent = `${n} ページ　A4横・余白8mm`;
  fitPreview();
}
function fitPreview(){
  const area=$('#printarea'); if(!area) return;
  const w=area.clientWidth; const mm=297*3.7795;
  const sc=Math.min(1, (w-4)/mm);
  $$('#printarea .psheet').forEach(el=>{
    el.style.transform = sc<1? `scale(${sc})` : '';
    el.style.transformOrigin='top left';
    el.style.marginBottom = sc<1? (18 - 210*3.7795*(1-sc))+'px' : '18px';
  });
  if(sc<1) area.style.height='';
}
window.addEventListener('resize', ()=>{ if(UI.view==='print') fitPreview(); });
</script>
<script>
/* =========================================================================
   GitHub方式の導入手順（ヘルプ）
   ========================================================================= */
const GITHUB_HELP_HTML = `
<p style="margin:0 0 12px;font-size:13px;line-height:1.8">最初に１回だけ、ご担当者様に行っていただく作業です（約5分）。
Azureのようなアプリ登録やリダイレクトURIの設定は<b>ありません</b>。用意するのは「入れ物」と「合鍵」の2つだけです。</p>

<h4 style="margin:14px 0 6px;font-size:13.5px">① データを入れるリポジトリ（入れ物）を作る</h4>
<ol style="line-height:1.9;padding-left:1.2em;margin:0">
<li><a href="https://github.com/new" target="_blank" rel="noopener">github.com/new</a> を開く</li>
<li>Repository name に <code>nippo-data</code> などと入力</li>
<li><b>Private（非公開）</b> を選ぶ　※ここは必ず Private にしてください</li>
<li>「Create repository」を押す</li>
</ol>

<h4 style="margin:14px 0 6px;font-size:13.5px">② アクセストークン（合鍵）を作る</h4>
<ol style="line-height:1.9;padding-left:1.2em;margin:0">
<li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> を開く</li>
<li>Token name に「作業日報」など分かる名前を入力</li>
<li>Expiration（有効期限）を選ぶ（1年など。期限が来たら作り直します）</li>
<li><b>Repository access</b> で「Only select repositories」を選び、①で作った <code>nippo-data</code> を指定</li>
<li><b>Repository permissions</b> の一覧から <b>Contents</b> を探し、<b>Read and write</b> に変更</li>
<li>下の「Generate token」を押し、表示された文字列（<code>github_pat_…</code>）をコピー
<br><span style="color:#c02626">※この文字列は一度しか表示されません。閉じる前にコピーしてください</span></li>
</ol>

<h4 style="margin:14px 0 6px;font-size:13.5px">③ 各端末に設定する</h4>
<ol style="line-height:1.9;padding-left:1.2em;margin:0">
<li>この画面の「保存先リポジトリ」に <code>〈GitHubのユーザー名〉/nippo-data</code> を入力</li>
<li>「アクセストークン」に②でコピーした文字列を貼り付け</li>
<li><b>「接続を確認」</b>を押す → 「接続できました」と出れば完了です</li>
<li>他の端末（スマホを含む）でも、同じリポジトリ名とトークンを入力します</li>
</ol>

<div style="margin-top:12px;padding:10px;background:#f4f7fb;border-radius:8px;font-size:12.5px;line-height:1.7">
<b>安全面について</b>：トークンは入力した端末のブラウザの中にだけ保存され、日報データにもバックアップファイルにも含まれません。
権限は①で作ったリポジトリ1つ分だけ、内容の読み書きに限られます。端末を紛失した場合などは、GitHubの
Settings → Developer settings → Personal access tokens から、そのトークンを削除すればすぐ使えなくなります。</div>`;

/* =========================================================================
   起動
   ========================================================================= */
async function boot(){
  const saved = await IDB.get('state');
  if(saved && saved.staff && Object.keys(saved.staff).length){ S = saved; TYPES.forEach(t=> S[t]=S[t]||{}); S.meta=Object.assign(blankState().meta, S.meta||{}); }
  else { S = blankState(); await seedIfEmpty(); }
  if(!S.config['config']) S.config['config']=Object.assign({},DEF_CONFIG,{_u:now(),_d:DEVICE});
  /* 「別の端末に設定を送る」で作ったリンクから開かれた場合は、その設定を取り込む */
  const linked = consumeSetupLink();
  migrateHolidaySeed();
  migrateRemovedStaff();
  migrateClearChips();
  migrateClearChips2();
  autoArchiveSites();

  const t=new Date();
  UI.mk = monthKey(t); UI.date = ymd(t);
  const sl=staffForMonth(UI.mk);
  UI.staffId = (S.meta.myStaff && sl.some(s=>s.id===S.meta.myStaff))? S.meta.myStaff : (sl[0]? sl[0].id : '');
  // データのある最新の月へ
  const months = new Set(live('entry').map(e=>e.date.slice(0,7)).concat(live('day').map(d=>d.date.slice(0,7))));
  if(months.size && !months.has(UI.mk)){
    const latest=Array.from(months).sort().pop();
    if(latest>UI.mk || !months.has(UI.mk)) { UI.mk=latest; UI.date=latest+'-01'; }
  }
  render();
  Sync.start();
  setTimeout(maybeMonthEndReminder, 3500);   // 起動時の自動同期を待ってから確認する
  if(linked){ toast('設定を読み込みました。同期しています…'); Sync.schedule(300); }
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}

/* 月末が近い時期（休日を除いた稼働日の残り3日以内）に起動したとき、
   同期されていない入力がこの端末に残っていれば、その日1回だけ注意をうながす */
function maybeMonthEndReminder(){
  try{
    if(!Sync.configured()) return;
    if(!nearMonthEnd(3)) return;
    const pend=Sync.pendingCount();
    if(pend<=0) return;
    const today=ymd(new Date());
    if(S.meta.endWarnOn===today) return;
    S.meta.endWarnOn=today; persist(true);
    const offline=!navigator.onLine;
    dialog('月末が近づいています', `
      <p style="margin:0 0 10px;font-size:14px;line-height:1.8">この端末に、<b>まだ同期されていない入力が ${pend} 件</b> あります。<br>
      このままでは他の端末や月末の集計・帳票に反映されません。</p>
      <p class="hint" style="margin:0">${offline
        ? 'いまは電波が届いていないようです。電波の届く場所でこのアプリを開くと自動で送信されます。'
        : '「今すぐ同期する」を押すと、その場で送信できます。'}</p>`,
      [ {t:'あとで'},
        {t:'今すぐ同期する', cls:'primary', fn:async()=>{
          toast('同期しています…');
          const r=await Sync.run('monthend');
          toast(r.ok? `同期しました（送信 ${r.sent} 件）` : '同期できませんでした：'+(r.error||'オフライン'), !r.ok);
          render();
        }} ]);
  }catch(e){ console.warn('month-end reminder skipped', e); }
}

/* 初回のみ：同梱データを取り込む */
async function seedIfEmpty(){
  try{
    const el=document.getElementById('seed'); if(!el) return;
    const j=JSON.parse(el.textContent);
    TYPES.forEach(t=> (j[t]||[]).forEach(r=>{ r._u=r._u||1; r._d=r._d||'SEED'; S[t][r.id]=r; S.meta.pending[t+'/'+r.id]=1; }));
    persist(true);
  }catch(e){ console.warn('seed skipped', e); }
  S.meta.holidaySeeded=true;
}

/* 休日データが1件も無い端末に、同梱の休日データを一度だけ取り込む。
   （社員・現場だけ入っていて休日が追加される前の版で使い始めた端末でも、
   更新後に自動で休日が反映されるようにするための移行処理） */
function migrateHolidaySeed(){
  if(S.meta.holidaySeeded) return;
  try{
    if(Object.keys(S.holiday).length===0){
      const el=document.getElementById('seed');
      if(el){
        const j=JSON.parse(el.textContent);
        (j.holiday||[]).forEach(r=>{
          S.holiday[r.id]=Object.assign({}, r, {_u:r._u||1, _d:r._d||'SEED'});
          S.meta.pending['holiday/'+r.id]=1;
        });
      }
    }
  }catch(e){ console.warn('holiday migrate skipped', e); }
  S.meta.holidaySeeded=true;
  persist(true);
}

/* 廃止された社員を、既存端末のデータからも一度だけ取り除く。
   実績が無ければ削除、実績があれば「在籍」から外すだけにして過去データは残す */
const REMOVED_STAFF_IDS=['s10','s11'];
function migrateRemovedStaff(){
  if(S.meta.staffCleanup1){ return; }
  REMOVED_STAFF_IDS.forEach(id=>{
    const r=S.staff[id]; if(!r || r._x) return;
    const used = live('entry').some(e=>e.staffId===id) || live('day').some(d=>d.staffId===id);
    if(used) put('staff', Object.assign({}, r, {active:false}));
    else del('staff', id);
  });
  S.meta.staffCleanup1=true;
  persist(true);
}

/* 作業内容の候補を、あらかじめ用意した固定リストから「入力した内容を覚えていく方式」に切り替える。
   以前の版で入っていた会社共通の初期候補と、それをそのままコピーしただけの個人の候補を一度だけ空にする
   （本人が手で編集した候補は残す） */
const OLD_DEFAULT_CHIPS=['現場管理','書類作成','見積書作成','現場調査','打合せ','講習','安全教育','健康診断','有給休暇','休日'];
function migrateClearChips(){
  if(S.meta.chipsCleared1) return;
  try{
    const c=cfg();
    const same=(a,b)=> Array.isArray(a) && a.length===b.length && a.every((x,i)=>x===b[i]);
    if(Array.isArray(c.noteChips) && c.noteChips.length) put('config', Object.assign({}, c, {noteChips:[]}));
    live('staff').forEach(s=>{ if(same(s.chips, OLD_DEFAULT_CHIPS)) put('staff', Object.assign({}, s, {chips:[]})); });
  }catch(e){ console.warn('chips migrate skipped', e); }
  S.meta.chipsCleared1=true;
  persist(true);
}

/* ユーザーからの再度の依頼により、作業内容・備考の候補を無条件でもう一度すべて空にする
   （会社共通の候補・各作業者の個人候補のどちらも、内容を問わず一度だけクリアする） */
function migrateClearChips2(){
  if(S.meta.chipsCleared2) return;
  try{
    const c=cfg();
    if(Array.isArray(c.noteChips) && c.noteChips.length) put('config', Object.assign({}, c, {noteChips:[]}));
    live('staff').forEach(s=>{ if(Array.isArray(s.chips) && s.chips.length) put('staff', Object.assign({}, s, {chips:[]})); });
  }catch(e){ console.warn('chips migrate2 skipped', e); }
  S.meta.chipsCleared2=true;
  persist(true);
}

/* 現場の自動非稼働化：2か月間どの日報にも使われていない現場を「稼働中」から自動的に外す。
   指定した現場は対象外。使用実績が一度もない現場は、この機能の導入日（createdAtの初回付与時点）
   を基準に2か月間は対象外とする */
const SITE_ARCHIVE_EXEMPT=['倉庫・プラント','林道道路環境整備筒賀地区','事務所','環境保全','除塵','講習','道路アダプト','安全教育','松原倉庫','健康診断'];
function autoArchiveSites(){
  try{
    live('site').forEach(s=>{ if(!s.createdAt) put('site', Object.assign({}, s, {createdAt:now()})); });
    const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-2);
    const cutoffYmd=ymd(cutoff);
    live('site').forEach(s=>{
      if(s.active===false) return;
      if(SITE_ARCHIVE_EXEMPT.indexOf(s.name)>=0) return;
      const used=live('entry').filter(e=>e.siteId===s.id && num(e.hours)>0).map(e=>e.date).sort();
      const lastUsed = used.length? used[used.length-1] : null;
      const ref = lastUsed || (s.createdAt? ymd(new Date(s.createdAt)) : null);
      if(ref && ref < cutoffYmd) put('site', Object.assign({}, s, {active:false}));
    });
  }catch(e){ console.warn('site auto-archive skipped', e); }
}

window.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); if(UI.view==='entry'&&draft) saveDraft(); }
  if((e.ctrlKey||e.metaKey) && e.key==='p' && UI.view!=='print'){ }
});

boot();
</script>
