<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12395c">
<title>作業集計日報システム</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作業日報">
<style>
:root{
  --navy:#12395c; --navy-d:#0c2740; --navy-l:#1d5182;
  --teal:#0f7b6c; --amber:#b96a00; --red:#c02626; --purple:#6d3fa0;
  --bg:#eef1f5; --panel:#ffffff; --line:#d3dae3; --line-s:#e7ecf2;
  --ink:#1a2430; --ink-2:#4a5768; --ink-3:#7c8899;
  --sun:#c02626; --sat:#1a63b8;
  --ok:#0f7b6c; --warn:#b96a00;
  --r:10px; --shadow:0 1px 2px rgba(16,32,52,.06),0 4px 14px rgba(16,32,52,.06);
  --fs:15px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* .row などの display 指定に負けないように */
html,body{margin:0;padding:0}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,"Noto Sans JP","Noto Sans CJK JP","MS PGothic",system-ui,sans-serif;
  font-size:var(--fs); color:var(--ink); background:var(--bg);
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:700}
a{color:var(--navy-l)}

/* ---------- app shell ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
header.top{
  background:linear-gradient(180deg,var(--navy-l),var(--navy));
  color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(10,30,50,.25)
}
.brand{font-weight:800;letter-spacing:.04em;font-size:16px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:10px;opacity:.75;letter-spacing:.12em}
.monthnav{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.13);border-radius:999px;padding:3px}
.monthnav button{background:none;border:0;color:#fff;font-size:17px;line-height:1;padding:6px 11px;border-radius:999px}
.monthnav button:hover{background:rgba(255,255,255,.18)}
.monthnav .lbl{font-weight:700;font-variant-numeric:tabular-nums;padding:0 6px;min-width:104px;text-align:center;font-size:14px}
.spacer{flex:1}
.syncchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.13);border:0;color:#fff;
  padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.syncchip .dot{width:8px;height:8px;border-radius:50%;background:#7fe0c8;box-shadow:0 0 0 3px rgba(127,224,200,.2)}
.syncchip.off .dot{background:#ffb44d;box-shadow:0 0 0 3px rgba(255,180,77,.2)}
.syncchip.err .dot{background:#ff8080;box-shadow:0 0 0 3px rgba(255,128,128,.2)}
.syncchip.busy .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

nav.tabs{display:flex;gap:0;background:var(--navy-d);position:sticky;top:0;z-index:39;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:1 0 auto;min-width:86px;background:none;border:0;border-bottom:3px solid transparent;
  color:rgba(255,255,255,.62);padding:11px 14px;font-weight:700;font-size:13.5px;white-space:nowrap
}
nav.tabs button.on{color:#fff;border-bottom-color:#6fd0ff;background:rgba(255,255,255,.06)}

main{flex:1;padding:14px;max-width:1500px;width:100%;margin:0 auto}
.view{display:none}
.view.on{display:block}

/* ---------- generic ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card>h3{padding:11px 14px;border-bottom:1px solid var(--line-s);font-size:14px;letter-spacing:.02em;
  display:flex;align-items:center;gap:8px;background:#f7f9fc}
.card>h3 .sub{font-weight:500;color:var(--ink-3);font-size:12px}
.card>h3.acc{cursor:pointer;user-select:none}
.card>h3.acc:hover{background:#eef2f8}
.card>h3.acc .chev{margin-left:auto;font-size:11px;color:var(--ink-3);flex:none;transition:transform .15s}
.card.open>h3.acc .chev{transform:rotate(180deg)}
.card .body{padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label{font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=password],select,textarea{
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;min-height:40px;width:100%}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%234a5768' stroke-width='2'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:30px}
input:focus,select:focus,textarea:focus{outline:2px solid #9ec8ee;outline-offset:-1px;border-color:var(--navy-l)}
textarea{min-height:64px;resize:vertical}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-weight:700;min-height:40px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f4f7fb}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-l)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--navy-l)}
.btn.danger{color:var(--red);border-color:#eccaca}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#f5f8fc;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.chip:hover{background:#e8f0f9}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2f7;color:var(--ink-2)}
.pill.ok{background:#e2f4ef;color:var(--teal)}
.pill.warn{background:#fdf0dd;color:var(--amber)}
.pill.off{background:#f0f1f3;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.hint{font-size:12px;color:var(--ink-3);line-height:1.6}
.grow{flex:1;min-width:150px}
hr.sep{border:0;border-top:1px solid var(--line-s);margin:14px 0}
.empty{padding:26px;text-align:center;color:var(--ink-3);font-size:13px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.gr{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.gr th,table.gr td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
table.gr thead th{background:#eef3f9;font-weight:700;font-size:12px;position:sticky;top:0;z-index:2}
table.gr td.l,table.gr th.l{text-align:left}
table.gr td.n{text-align:right}
table.gr tbody tr:hover{background:#f6faff}
table.gr tr.sun td{background:#fdf1f1}
table.gr tr.sat td{background:#f1f6fd}
table.gr tr.sun:hover td{background:#fbe8e8}
table.gr tfoot td{background:#eef3f9;font-weight:700}
.num0{color:#c6ccd4}
.d-sun{color:var(--sun);font-weight:700}
.d-sat{color:var(--sat);font-weight:700}
.tag-hol{background:#fdf1f1;color:var(--sun)}
/* ---------- entry screen ---------- */
.picker{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
@media(max-width:700px){ .picker{grid-template-columns:1fr} .daybar #eDate{min-width:0;flex:1} }
.daybar{display:flex;align-items:center;gap:6px}
.daybar .btn{min-width:40px;padding:9px 10px}

/* 入力中の日付を、下へスクロールしても見失わないよう画面上部に固定して表示する */
.daysticky{position:sticky;top:var(--navh,44px);z-index:30;display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:7px 10px;margin-bottom:12px}
.daysticky .dsmain{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.daysticky .dsmain b{font-size:18px;font-weight:800;white-space:nowrap;letter-spacing:.02em}
.daysticky .who{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.daysticky .dstot{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.daysticky .btn{min-width:36px;padding:5px 9px;font-size:16px;flex:none}
@media(max-width:480px){
  .daysticky{padding:6px 8px;gap:6px}
  .daysticky .dsmain{flex-wrap:nowrap}
  .daysticky .dsmain b{font-size:16px}
  .daysticky .who{max-width:5.5em;font-size:11.5px}
  .daysticky .dstot{font-size:11.5px}
  .daysticky .pill{padding:2px 6px;font-size:10px}
}

.calstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.calstrip .cd{position:relative;border:1px solid var(--line);border-radius:8px;background:#fff;padding:5px 2px;text-align:center;font-size:12px;line-height:1.25;min-height:46px;-webkit-touch-callout:none;user-select:none}
.calstrip .cd .dd{font-weight:700;font-size:13px}
.calstrip .cd .hh{font-size:10.5px;color:var(--ink-3);font-weight:700}
.calstrip .cd.has{background:#eaf5f1;border-color:#b6ded2}
.calstrip .cd.has .hh{color:var(--teal)}
.calstrip .cd.miss{background:#fff5f5;border-color:#f0cccc}
.calstrip .cd.rest{background:#f4f5f7;color:var(--ink-3)}
.calstrip .cd.sel{outline:3px solid var(--navy);outline-offset:-1px;border-color:var(--navy)}
.calstrip .cd.batchon{outline:3px solid var(--teal);outline-offset:-1px;border-color:var(--teal);background:#e2f4ef}
.calstrip .cd.sel.batchon{outline-color:var(--navy)}
/* 未同期の日：日付全体をオレンジにし、「未同期」の文字を出す（一目で分かるように） */
.calstrip .cd.unsent{background:#fdf0dc;border-color:#dc9a3c;box-shadow:inset 0 0 0 1px #dc9a3c}
.calstrip .cd.unsent .dd{color:#8a5000 !important}
.calstrip .cd.unsent .hh{color:#8a5000}
.calstrip .cd .unlbl,.unlbl-legend{display:inline-block;background:var(--amber);color:#fff;border-radius:3px;
  font-size:9.5px;font-weight:800;line-height:1.45;padding:0 3px;letter-spacing:.02em;white-space:nowrap}
.calstrip .cd .unlbl{margin-top:1px}
.unlbl-legend{vertical-align:1px}
.calstrip .cd.pad{border:0;background:none;pointer-events:none}
.calstrip .hd{text-align:center;font-size:11px;font-weight:700;color:var(--ink-2);padding:2px 0}

/* 作業内容の候補：本体を押すと入力、右の✕でその候補を削除 */
.chips .chipwrap{display:inline-flex;align-items:center;border:1px solid var(--line);background:#f5f8fc;border-radius:999px;overflow:hidden}
.chips .chipwrap:hover{background:#e8f0f9}
.chips .chipwrap .cmain{border:0;background:none;padding:5px 5px 5px 11px;font-size:12.5px;font-weight:600}
.chips .chipwrap .cx{border:0;background:none;padding:5px 9px 5px 3px;font-size:11px;color:var(--ink-3);line-height:1}
.chips .chipwrap .cx:hover{color:var(--red)}

.ent{display:grid;grid-template-columns:1fr 150px 40px;gap:8px;align-items:center;margin-bottom:8px}
.ent .sitebtn{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;font-weight:600}
.ent .sitebtn .ph{color:var(--ink-3);font-weight:400}
.ent .sitebtn .arrow{color:var(--ink-3);font-size:11px;flex:none}
.ent .hbox{display:flex;align-items:center;gap:4px}
.ent .hbox input{text-align:center;font-weight:700;font-size:16px;padding:9px 4px}
.ent .hbox button{width:38px;min-height:40px;flex:0 0 38px;border:1px solid var(--line);background:#f4f7fb;border-radius:8px;font-weight:800;font-size:15px}
.ent .del{border:1px solid var(--line);background:#fff;border-radius:8px;min-height:40px;color:var(--red);font-size:16px}
@media(max-width:620px){ .ent{grid-template-columns:1fr 44px;gap:6px} .ent .sitebtn{grid-column:1 / -1} .ent .del{width:auto} }

.calc{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.calc div{background:#fff;padding:9px 4px;text-align:center}
.calc .k{font-size:11px;color:var(--ink-2);font-weight:700}
.calc .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.calc .t-sum{background:#f2f7fc}
.calc .t-sum .v{color:var(--navy)}
.calc .t-ot .v{color:var(--amber)}
.calc .t-nt .v{color:var(--purple)}
.calc .t-hd .v{color:var(--red)}
.calc .zero .v{color:#c6ccd4}
@media(max-width:560px){.calc{grid-template-columns:repeat(3,1fr)} .calc .v{font-size:18px}}
.calc .fill{background:#fff}

.stickysave{position:sticky;bottom:0;padding:10px 0 calc(env(safe-area-inset-bottom) + 10px);
  background:linear-gradient(180deg,rgba(238,241,245,0),var(--bg) 32%);display:flex;gap:8px;z-index:20}
.stickysave .btn{flex:1;min-height:48px;font-size:15px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#1a2430;color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:13.5px;
  z-index:100;transition:.22s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--red)}

/* ---------- admin lists ---------- */
.lst{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lst .it{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-s);background:#fff}
.lst .it:last-child{border-bottom:0}
.lst .it.inactive{background:#fafbfc;color:var(--ink-3)}
.lst .it .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lst .it input[type=text]{min-height:34px;padding:6px 8px}
.ord{display:flex;flex-direction:column;gap:1px}
.ord button{border:1px solid var(--line);background:#fff;width:26px;height:19px;line-height:1;font-size:10px;border-radius:4px}

.modal{position:fixed;inset:0;background:rgba(14,26,40,.55);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:88dvh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .box h3{padding:14px 16px;border-bottom:1px solid var(--line-s)}
.modal .box .body{padding:16px}
.modal .box .foot{padding:12px 16px;border-top:1px solid var(--line-s);display:flex;gap:8px;justify-content:flex-end}

.banner{border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.65;margin-bottom:14px;border:1px solid}
.banner.info{background:#eef5fc;border-color:#c8ddf1;color:#134a77}
.banner.warn{background:#fdf6e9;border-color:#eddcb8;color:#7a5300}
.banner.bad{background:#fdeeee;border-color:#f0c9c9;color:#8c1f1f}
.banner b{font-weight:800}

.topbanner{display:none;align-items:center;gap:12px;flex-wrap:wrap;
  padding:11px 16px;margin-bottom:14px;border-radius:var(--r);
  background:#fdf6e9;border:1px solid #eddcb8;color:#7a5300;font-size:13.5px;line-height:1.6;box-shadow:var(--shadow)}
.topbanner[hidden]{display:none}
.topbanner.on{display:flex}
.topbanner .ic{font-size:16px;flex:none}
.topbanner b{font-weight:800}
.topbanner .btn{min-height:32px;padding:6px 13px;font-size:12.5px}
/* ================= PRINT ================= */
#printarea{background:var(--bg)}
#printarea .psheet{
  background:#fff;margin:0 auto 18px;padding:9mm 8mm;width:297mm;min-height:210mm;
  box-shadow:0 2px 16px rgba(16,32,52,.18);border:1px solid var(--line);
  color:#000;overflow:hidden
}
#printarea .psheet.portrait{width:210mm;min-height:297mm}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:2px;
  border-bottom:1.6pt solid #123;padding-bottom:1.5px}
.phead .t{font-size:13.5pt;font-weight:800;letter-spacing:.1em;line-height:1.12}
.phead .m{font-size:9pt;font-weight:700;letter-spacing:.06em;line-height:1.15}
.phead .who{font-size:12pt;font-weight:800;letter-spacing:.08em}
.phead .who span{font-size:9pt;font-weight:600;letter-spacing:.1em;margin-right:6px;color:#333}
.psub{display:flex;justify-content:space-between;font-size:8pt;color:#333;margin:3px 0 4px}

table.pt{border-collapse:collapse;width:100%;font-size:8pt;font-variant-numeric:tabular-nums;table-layout:fixed}
table.pt th,table.pt td{border:.5pt solid #333;padding:0 1.5px;text-align:center;height:4.35mm;overflow:hidden;line-height:1.12}
table.pt thead th{background:#e8edf3;font-weight:700;font-size:7.5pt}
table.pt thead th.vt{height:29mm;padding:2px 1px 3px;overflow:hidden;vertical-align:bottom}
table.pt thead th.vt>span{display:inline-block;writing-mode:vertical-rl;text-orientation:mixed;
  max-height:27mm;line-height:1.28;letter-spacing:0;
  font-size:6.4pt;font-weight:700;text-align:start}
table.pt td.l{text-align:left;padding-left:3px}
table.pt td.txt{text-align:left;padding-left:3px;font-size:7pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.pt tr.sun td{background:#fbeaea}
table.pt tr.sat td{background:#eaf0fa}
table.pt tr.hol td{background:#fbeaea}
table.pt tfoot td,table.pt tr.tot td{background:#e8edf3;font-weight:800;border-top:1.2pt solid #333}
table.pt td.z{color:#c9c9c9}
table.pt .dw{font-weight:700}
table.pt .dw.s{color:#c02626}
table.pt .dw.b{color:#1a63b8}
table.pt col.cday{width:13mm}
table.pt col.cw{width:6.5mm}
table.pt col.ct{width:10mm}
table.pt col.ch{width:9.5mm}
.pnote{font-size:7.5pt;color:#444;margin-top:3px}
.pgrid2{display:grid;grid-template-columns:1fr 1fr;gap:6mm}

.printbar{position:sticky;top:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}

@page{size:A4 landscape;margin:8mm}
@media print{
  html,body{background:#fff !important;margin:0;padding:0}
  header.top,nav.tabs,.printbar,.stickysave,.toast,.noprint{display:none !important}
  main{padding:0;max-width:none}
  .view{display:none !important}
  #v-print{display:block !important}
  #printarea{background:#fff}
  #printarea .psheet{width:auto;min-height:0;margin:0 !important;padding:0;box-shadow:none;border:0;
    transform:none !important;
    page-break-after:always;break-after:page}
  #printarea .psheet:last-child{page-break-after:auto;break-after:auto}
  table.pt{page-break-inside:auto}
  table.pt tr{page-break-inside:avoid}
  table.pt thead{display:table-header-group}
}
@media(max-width:1360px){ #printarea{overflow-x:auto} }
</style>
</head>
<body>
<div id="app">
<header class="top">
  <div class="brand">作業集計日報<small id="coname">SAGYO NIPPO SYSTEM</small></div>
  <div class="monthnav">
    <button id="mPrev" title="前の月">‹</button>
    <span class="lbl" id="mLabel">—</span>
    <button id="mNext" title="次の月">›</button>
    <button id="mToday" title="今月へ" style="font-size:12px;font-weight:700">今月</button>
  </div>
  <div class="spacer"></div>
  <button class="syncchip" id="syncChip"><span class="dot"></span><span id="syncTxt">確認中</span></button>
</header>

<nav class="tabs" id="tabs">
  <button data-v="entry" class="on">日報入力</button>
  <button data-v="month">月間一覧</button>
  <button data-v="sum">集計</button>
  <button data-v="print">印刷</button>
  <button data-v="admin">管理・設定</button>
</nav>

<main>
<div class="topbanner noprint" id="syncBanner" hidden>

/* =========================================================================
   作業集計日報システム  v1.0
   - 完全オフライン動作（IndexedDB）＋ オンライン復帰時に自動同期
   - 競合のない Last-Writer-Wins マージ（コピーファイルは発生しません）
   ========================================================================= */
'use strict';

/* ---------------- 小道具 ---------------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const pad2 = n => String(n).padStart(2,'0');
const uid = ()=> 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const now = ()=> Date.now();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['日','月','火','水','木','金','土'];
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function monthKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
function daysInMonth(mk){ const [y,m]=mk.split('-').map(Number); return new Date(y,m,0).getDate(); }
function monthDates(mk){ const n=daysInMonth(mk); const a=[]; for(let i=1;i<=n;i++) a.push(mk+'-'+pad2(i)); return a; }
/* その月の「稼働日の最終日」＝休日（毎週の休日・休日指定日）を除いた、月内で一番遅い日 */
function lastWorkDay(mk){
  const dates=monthDates(mk);
  for(let i=dates.length-1;i>=0;i--){ if(!isRestDay(dates[i])) return dates[i]; }
  return dates[dates.length-1];
}
/* 月末が近いか＝その月の稼働日（休日を除く日）の残りが n 日以内になったか（既定3日） */
function nearMonthEnd(n){
  const t=new Date(), mk=monthKey(t), today=ymd(t);
  const wd=monthDates(mk).filter(d=>!isRestDay(d));
  if(!wd.length) return true;
  return today >= wd[Math.max(0, wd.length-(n||3))];
}
function reiwa(y){ return y-2018; }
function jpMonth(mk){ const [y,m]=mk.split('-').map(Number); return `令和${reiwa(y)}年${m}月`; }
function jpMonthFull(mk){ const [y,m]=mk.split('-').map(Number); return `${y}年（令和${reiwa(y)}年）${m}月`; }
function t2m(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function m2t(v){ v=((v%1440)+1440)%1440; return pad2(Math.floor(v/60))+':'+pad2(v%60); }
/* 作業時間の表示は小数第1位で統一する（7 → 7.0、7.5 → 7.5）。桁がそろって読みやすくなる */
function fx(v,d){ if(v==null||v===''||v===0) return ''; return (Math.round(v*100)/100).toFixed(d==null?1:d); }
/* 入力された時間は小数第1位に丸めて保存する（表示と中身を一致させる） */
function h1(v){ return Math.round(num(v)*10)/10; }
function num(v){ const n=parseFloat(v); return isFinite(n)?n:0; }

/* ---------------- 端末ID / 端末名 ---------------- */
function getDeviceId(){
  let id=null; try{ id=localStorage.getItem('nippo.deviceId'); }catch(e){}
  if(!id){ id='D'+Math.random().toString(36).slice(2,8).toUpperCase(); try{localStorage.setItem('nippo.deviceId',id);}catch(e){} }
  return id;
}
const DEVICE = getDeviceId();

/* ---------------- IndexedDB（1キー保存・堅牢＆高速） ---------------- */
const IDB = (()=>{
  const NAME='nippoDB', STORE='kv'; let p=null;
  function open(){
    if(p) return p;
    p = new Promise((res,rej)=>{
      if(!self.indexedDB) return rej(new Error('no idb'));
      const r=indexedDB.open(NAME,1);
      r.onupgradeneeded=()=>{ r.result.createObjectStore(STORE); };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
    return p;
  }
  return {
    async get(k){ try{ const db=await open(); return await new Promise((res,rej)=>{
        const t=db.transaction(STORE,'readonly').objectStore(STORE).get(k);
        t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }
      catch(e){ try{ const s=localStorage.getItem('nippo.'+k); return s?JSON.parse(s):undefined; }catch(_){ return undefined; } } },
    async set(k,v){ try{ const db=await open(); return await new Promise((res,rej)=>{
        const t=db.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);
        t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }
      catch(e){ try{ localStorage.setItem('nippo.'+k, JSON.stringify(v)); }catch(_){ } } }
  };
})();

/* ---------------- データモデル ----------------
   全レコード共通: {id, _u:updatedAt(ms), _d:deviceId, _x:deleted(bool)}
   staff   : {id,name,ord,active,note}
   site    : {id,name,ord,active,code}
   holiday : {id=日付, name}
   day     : {id=staffId+'|'+date, staffId,date,start,end,note}
   entry   : {id, staffId,date,siteId,hours}
   config  : {id='config', company, stdHours, nightFrom, nightTo, restWd[], defStart, defEnd, noteChips[]}
-------------------------------------------------- */
const TYPES=['staff','site','holiday','day','entry','config'];
/* noteChips（作業内容の候補）は空から始め、入力した内容を各自の候補として覚えていく */
const DEF_CONFIG={ id:'config', company:'', stdHours:7, nightFrom:'22:00', nightTo:'05:00',
  restWd:[0], defStart:'08:00', defEnd:'17:00', ghRepo:'', jpHolidays:true,
  noteChips:[] };

let S = null;  // state
function blankState(){
  const s={ v:1, meta:{ pending:{}, lastSyncAt:0, autoSync:true, myStaff:'',
    ghRepo:'', peerVer:{},
    holidaySeeded:false, staffCleanup1:false, chipsCleared1:false, chipsCleared2:false, pendingSince:0, endWarnOn:'' } };
  TYPES.forEach(t=> s[t]={});
  s.config['config']=Object.assign({},DEF_CONFIG,{_u:now(),_d:DEVICE});
  return s;
}
function cfg(){ return Object.assign({},DEF_CONFIG, S.config['config']||{}); }
/* 作業内容の候補チップ：社員本人が編集していればそちらを優先、無ければ会社共通の初期候補 */
function chipsFor(staffId){
  const s=staffId && S.staff[staffId];
  if(s && Array.isArray(s.chips) && s.chips.length) return s.chips;
  return cfg().noteChips||[];
}

let masterRev=1;   // 社員・現場・設定が変わるたびに増やす（セレクトの再構築用）
let saveTimer=null, dirty=false;
function persist(immediate){
  dirty=true;
  if(saveTimer) clearTimeout(saveTimer);
  const go=()=>{ saveTimer=null; dirty=false; IDB.set('state', S); };
  if(immediate) go(); else saveTimer=setTimeout(go,220);
}
/* 閉じる・切り替える直前に、入力中の下書きも含めて必ず保存する */
function flushDraftIfDirty(){
  try{ if(typeof draft!=='undefined' && draft && typeof hasEdits==='function' && hasEdits()) commitDraft(true); }catch(e){}
}
window.addEventListener('pagehide',()=>{ flushDraftIfDirty(); if(dirty) IDB.set('state',S); });
window.addEventListener('beforeunload', e=>{
  /* 閉じる直前に未保存の入力があったかどうかを先に判定してから、必ず保存する。
     ブラウザ標準の確認ダイアログは文言を変更できない仕様（全ブラウザ共通の制限）だが、
     ここで表示させておけば「はい」「いいえ」どちらを選んでも、直前に保存は完了している。 */
  const had = (typeof hasEdits==='function' && typeof draft!=='undefined' && draft && hasEdits());
  flushDraftIfDirty();
  if(dirty) IDB.set('state',S);
  if(had){ e.preventDefault(); e.returnValue=''; }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushDraftIfDirty(); });

/* レコード書き込み（更新時刻を打ち、同期待ちに積む） */
function put(type, rec, opt){
  rec._u = now(); rec._d = DEVICE;
  if(!rec.id) rec.id = uid();
  S[type][rec.id] = rec;
  if(type==='staff'||type==='site'||type==='config') masterRev++;
  S.meta.pending[type+'/'+rec.id] = 1;
  persist(opt&&opt.now);
  return rec;
}
function del(type, id){
  const r = S[type][id]; if(!r) return;
  const t = {id:id, _x:true, _u:now(), _d:DEVICE};
  S[type][id]=t; if(type==='staff'||type==='site'||type==='config') masterRev++;
  S.meta.pending[type+'/'+id]=1; persist();
}
function live(type){ return Object.values(S[type]).filter(r=>!r._x); }

/* LWW マージ（全体を丸ごと比較） */
function mergeRec(type, rec){
  if(!rec || !rec.id) return false;
  if(type==='day') return mergeDayRec(rec);   // dayは項目ごとにマージする（下記）
  const cur = S[type][rec.id];
  if(cur){
    if((cur._u||0) > (rec._u||0)) return false;
    if((cur._u||0) === (rec._u||0) && String(cur._d||'') >= String(rec._d||'')) return false;
  }
  S[type][rec.id]=rec;
  if(type==='staff'||type==='site'||type==='config') masterRev++;
  return true;
}
/* dayレコード（1人・1日ぶんの始業/終業/備考）は、start・end・noteをそれぞれ別々に
   「あとから更新したほうが残る」でマージする。同じ日を2台の端末がほぼ同時に別の
   項目（例：片方が時刻、もう片方が備考）を直しても、片方が丸ごと消えないようにするため。
   レコードごと削除（_x:true）された場合だけは、これまでどおりレコード全体をLWW比較する。 */
function mergeDayRec(rec){
  const cur = S.day[rec.id];
  if(!cur){ S.day[rec.id]=rec; return true; }
  if(rec._x || cur._x){
    if((cur._u||0) > (rec._u||0)) return false;
    if((cur._u||0) === (rec._u||0) && String(cur._d||'') >= String(rec._d||'')) return false;
    S.day[rec.id]=rec; return true;
  }
  const curUf=cur._uf||{}, recUf=rec._uf||{};
  const fields=['start','end','note'];
  let changed=false;
  const merged=Object.assign({}, cur);
  const newUf={};
  fields.forEach(k=>{
    const ct=curUf[k]!=null?curUf[k]:(cur._u||0);
    const rt=recUf[k]!=null?recUf[k]:(rec._u||0);
    if(rt>ct || (rt===ct && String(rec._d||'')>String(cur._d||''))){
      merged[k]=rec[k]; newUf[k]=rt; changed=true;
    } else newUf[k]=ct;
  });
  if(!changed) return false;
  merged._uf=newUf;
  merged._u=Math.max(cur._u||0, rec._u||0);
  merged._d=(merged._u===(rec._u||0))? rec._d : cur._d;
  S.day[rec.id]=merged;
  return true;
}

/* ---------------- マスタ取得 ---------------- */
function staffList(includeInactive){
  return live('staff').filter(s=> includeInactive || s.active!==false)
    .sort((a,b)=> (a.ord||0)-(b.ord||0) || a.name.localeCompare(b.name,'ja'));
}
function staffForMonth(mk){
  // 在籍者は常に表示。退職者は、その月に実績が残っている場合のみ表示（過去の帳票は消えません）
  const has=new Set();
  live('entry').forEach(e=>{ if(e.date.slice(0,7)===mk) has.add(e.staffId); });
  live('day').forEach(d=>{ if(d.date.slice(0,7)===mk) has.add(d.staffId); });
  return staffList(true).filter(s=> s.active!==false || has.has(s.id));
}
function siteList(includeInactive){
  return live('site').filter(s=> includeInactive || s.active!==false)
    .sort((a,b)=> (a.ord||0)-(b.ord||0) || a.name.localeCompare(b.name,'ja'));
}
function siteById(id){ const s=S.site[id]; return (s&&!s._x)?s:null; }
function siteName(id){ const s=siteById(id); return s? s.name : '(削除された現場)'; }
function staffName(id){ const s=S.staff[id]; return (s&&!s._x)? s.name : '(削除)'; }
/* ---------------- 日本の祝日（祝日法にもとづく自動計算） ----------------
   ハッピーマンデー・春分/秋分（1980〜2099年の近似式）・振替休日・国民の休日に対応。
   会社の休み（土曜・盆・年末年始など）は「休日カレンダー」で別途指定する。
------------------------------------------------------------------------ */
const JP_HOL_CACHE={};
function jpHolidays(year){
  if(JP_HOL_CACHE[year]) return JP_HOL_CACHE[year];
  const map={};
  const key=(m,d)=> year+'-'+pad2(m)+'-'+pad2(d);
  const set=(m,d,name)=>{ if(d>=1) map[key(m,d)]=name; };
  const nthMonday=(m,n)=>{
    const first=new Date(year,m-1,1);
    return 1 + ((8-first.getDay())%7) + 7*(n-1);
  };
  const y=year;
  set(1,1,'元日');
  set(1,nthMonday(1,2),'成人の日');
  set(2,11,'建国記念の日');
  if(y>=2020) set(2,23,'天皇誕生日');
  else if(y>=1989) set(12,23,'天皇誕生日');
  set(3, Math.floor(20.8431 + 0.242194*(y-1980) - Math.floor((y-1980)/4)), '春分の日');
  set(4,29, y>=2007? '昭和の日' : 'みどりの日');
  set(5,3,'憲法記念日');
  if(y>=2007) set(5,4,'みどりの日');
  set(5,5,'こどもの日');
  if(y>=2003) set(7,nthMonday(7,3),'海の日'); else if(y>=1996) set(7,20,'海の日');
  if(y>=2016) set(8,11,'山の日');
  if(y>=2003) set(9,nthMonday(9,3),'敬老の日'); else set(9,15,'敬老の日');
  set(9, Math.floor(23.2488 + 0.242194*(y-1980) - Math.floor((y-1980)/4)), '秋分の日');
  if(y>=2020) set(10,nthMonday(10,2),'スポーツの日');
  else if(y>=2000) set(10,nthMonday(10,2),'体育の日');
  set(11,3,'文化の日');
  set(11,23,'勤労感謝の日');

  /* 国民の休日：祝日にはさまれた平日（日曜を除く）を休日にする */
  const base=Object.keys(map).slice();
  base.forEach(k=>{
    const d=parseYmd(k); const nxt=addDays(k,2), mid=addDays(k,1);
    if(map[nxt] && !map[mid] && parseYmd(mid).getDay()!==0) map[mid]='国民の休日';
  });
  /* 振替休日：日曜に当たった祝日の直後で、祝日でない最初の日 */
  Object.keys(map).slice().sort().forEach(k=>{
    if(parseYmd(k).getDay()!==0) return;
    let d=addDays(k,1);
    while(map[d]) d=addDays(d,1);
    if(d.slice(0,4)===String(year)) map[d]='振替休日';
  });
  JP_HOL_CACHE[year]=map;
  return map;
}
function jpHolidayName(date){
  if(cfg().jpHolidays===false) return '';
  const y=+date.slice(0,4);
  if(!(y>=1980 && y<=2099)) return '';
  return jpHolidays(y)[date]||'';
}
/* 休日レコード：{id:日付, name} = 会社休日 ／ {id:日付, work:true} = 祝日でも出勤する日 */
function holidayRec(date){ const h=S.holiday[date]; return (h && !h._x)? h : null; }
function isHoliday(date){
  const h=holidayRec(date);
  if(h && h.work) return false;      // 祝日だが出勤と指定した日
  if(h) return true;                 // 会社休日として登録した日
  return !!jpHolidayName(date);      // 日本の祝日は既定で休み
}
function holidayName(date){
  const h=holidayRec(date);
  if(h && h.work) return '';
  const pub=jpHolidayName(date);
  if(h) return h.name || pub || '';
  return pub;
}
function isRestDay(date){
  const c=cfg(); const w=parseYmd(date).getDay();
  return (c.restWd||[0]).indexOf(w)>=0 || isHoliday(date);
}
function getDay(staffId,date){ const r=S.day[staffId+'|'+date]; return (r&&!r._x)?r:null; }
function entriesOf(staffId,date){
  return live('entry').filter(e=> e.staffId===staffId && e.date===date);
}
function entriesOfMonth(mk){
  return live('entry').filter(e=> e.date.slice(0,7)===mk);
}

/* ---------------- 計算ロジック（現行Excel踏襲） ----------------
   合計   = 現場別時間の合計
   深夜   = 勤務時間帯と 22:00〜翌5:00 の重なり
   所定   = 休日以外なら min(合計, 所定時間=7)
   時間外 = 休日以外で 合計>所定 のとき 合計 − 所定 − 深夜
   休日   = 日曜・休日指定日なら 合計 − 深夜
------------------------------------------------------------------ */
function nightHours(start,end){
  const c=cfg(); if(!start||!end) return 0;
  let s=t2m(start), e=t2m(end); if(e<=s) e+=1440;
  const nf=t2m(c.nightFrom), nt=t2m(c.nightTo);
  let total=0;
  // 深夜帯を [nf, nt+1440] とみなし、前日・当日・翌日の3周期で重なりを取る
  for(let k=-1;k<=1;k++){
    const a=nf+k*1440, b=(nt<=nf? nt+1440 : nt)+k*1440;
    total += Math.max(0, Math.min(e,b)-Math.max(s,a));
  }
  return Math.round(total/60*100)/100;
}
function calcDay(staffId,date){
  const c=cfg(); const d=getDay(staffId,date); const es=entriesOf(staffId,date);
  const total = Math.round(es.reduce((a,e)=>a+num(e.hours),0)*100)/100;
  const rest = isRestDay(date);
  const night = d? nightHours(d.start,d.end) : 0;
  const std = c.stdHours||7;
  let kitei=0, over=0, hol=0;
  if(rest){ hol = Math.max(0, Math.round((total-night)*100)/100); }
  else{
    kitei = Math.min(total, std);
    if(total>std) over = Math.round((total-std-night)*100)/100;
    if(over<0) over=0;
  }
  return { total, kitei, over, night: (total>0||d&&d.start)?night:0, hol, rest,
           start:d?d.start:'', end:d?d.end:'', note:d?d.note:'' , entries:es};
}
function monthCalc(staffId,mk){
  const out={}; let T={total:0,kitei:0,over:0,night:0,hol:0};
  monthDates(mk).forEach(dt=>{ const r=calcDay(staffId,dt); out[dt]=r;
    T.total+=r.total; T.kitei+=r.kitei; T.over+=r.over; T.night+=r.night; T.hol+=r.hol; });
  Object.keys(T).forEach(k=> T[k]=Math.round(T[k]*100)/100);
  return {days:out, total:T};
}
/* その人がその月に使った現場（表示順） */
function sitesUsed(staffId,mk){
  const m={}; entriesOfMonth(mk).forEach(e=>{ if(!staffId||e.staffId===staffId){ if(num(e.hours)) m[e.siteId]=(m[e.siteId]||0)+num(e.hours); } });
  const order={}; siteList(true).forEach((s,i)=>order[s.id]=i);
  return Object.keys(m).sort((a,b)=> (order[a]==null?9999:order[a])-(order[b]==null?9999:order[b]));
}
</script>
<script>
/* =========================================================================
   同期エンジン（GitHubのプライベートリポジトリ）
   - 置き場所はGitHubのリポジトリ1つだけ。どの端末（PC・スマホ・タブレット）
     からでも、同じURLを開いて同じ設定を入れれば同じ日報が見られる。
   - 端末ごとのスナップショット（device-xxxx.json）を1つずつ置く。
     自分の端末は自分のファイルだけを上書きするので、他の端末と同時に
     書き込んでも衝突しない。
   - 読み込み側は、変わったファイルだけを取得してLWW（あとから保存した
     ほうが残る）でマージする。
   - 電波の無い場所での入力は端末内に貯まり、オンライン復帰で自動送信。
   - トークンは秘密なので、同期データにもバックアップにも含めず、
     その端末のブラウザの中（localStorage）にだけ保存する。
   ========================================================================= */
const GH_API='https://api.github.com';
const GH_DIR='data';
const DEVFILE_RE=/^device-.+\.json$/i;

function ghToken(){ try{ return localStorage.getItem('nippo.ghToken')||''; }catch(e){ return ''; } }
function setGhToken(t){
  try{ if(t) localStorage.setItem('nippo.ghToken', String(t).trim()); else localStorage.removeItem('nippo.ghToken'); }catch(e){}
}
function ghRepo(){
  return (S.meta.ghRepo||'').trim()
    .replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/,'').replace(/^\/+|\/+$/g,'');
}
function b64utf8(s){ return btoa(unescape(encodeURIComponent(s))); }
function unb64utf8(s){ return decodeURIComponent(escape(atob(s))); }

async function ghFetch(path, opt){
  opt=opt||{};
  const headers=Object.assign({
    'Authorization':'Bearer '+ghToken(),
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  }, opt.headers||{});
  return await fetch(GH_API+path, Object.assign({}, opt, {headers}));
}
function ghErrMsg(res){
  if(res.status===401) return 'アクセストークンが正しくないか、期限が切れています';
  if(res.status===404) return '保存先が見つかりません（リポジトリ名の間違い、またはトークンにこのリポジトリの権限がありません）';
  if(res.status===403) return 'アクセスが拒否されました（トークンの権限、または回数制限をご確認ください）';
  if(res.status===409 || res.status===422) return '他の端末と同時に書き込みが発生しました。もう一度お試しください';
  return '通信に失敗しました（'+res.status+'）';
}

/* 設定が正しいかその場で確かめる（「接続を確認」ボタン用） */
async function ghCheck(){
  const repo=ghRepo();
  if(!repo) return {ok:false, msg:'保存先リポジトリを入力してください（例：yamada/nippo-data）'};
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)) return {ok:false, msg:'保存先は「GitHubのユーザー名／リポジトリ名」の形で入力してください（例：yamada/nippo-data）'};
  if(!ghToken()) return {ok:false, msg:'アクセストークンを入力してください'};
  let res;
  try{ res=await ghFetch('/repos/'+repo); }
  catch(e){ return {ok:false, msg:'インターネットに接続できませんでした'}; }
  if(!res.ok) return {ok:false, msg:ghErrMsg(res)};
  const j=await res.json();
  if(j.permissions && j.permissions.push===false)
    return {ok:false, msg:'このトークンでは書き込みができません（トークンの Contents を Read and write にしてください）'};
  /* 公開・非公開はそのまま事実として伝えるだけにする（警告は出さない） */
  return {ok:true, msg:'「'+j.full_name+'」に接続できました'+(j.private?'（非公開リポジトリ）':'（公開リポジトリ）')};
}

/* この端末が持つ全レコードのスナップショット（削除済みのタブストーンも含む） */
function exportSnapshot(){
  const o={ver:1, device:DEVICE, savedAt:now()};
  TYPES.forEach(t=> o[t]=Object.values(S[t]));
  return o;
}
function importSnapshot(data){
  let changed=0;
  TYPES.forEach(t=> (data[t]||[]).forEach(r=>{ if(mergeRec(t,r)) changed++; }));
  return changed;
}

const Sync = (()=>{
  let busy=false, timer=null, lastErr='';
  let listeners=[];

  function configured(){ return !!(ghRepo() && ghToken()); }
  function notReady(){
    if(!ghRepo()) return '保存先が未設定';
    if(!ghToken()) return 'トークン未設定';
    return '';
  }
  function pendingCount(){ return Object.keys(S.meta.pending||{}).length; }
  function onChange(fn){ listeners.push(fn); }
  function emit(){ listeners.forEach(f=>{ try{f();}catch(e){} }); }

  function status(){
    const issue=notReady();
    if(issue) return {k:'local', txt:issue, cls:'off'};
    if(busy) return {k:'busy', txt:'同期中…', cls:'busy'};
    if(!navigator.onLine) return {k:'offline', txt:'オフライン'+(pendingCount()?'（未送信 '+pendingCount()+'）':''), cls:'off'};
    if(lastErr) return {k:'error', txt:'同期エラー'+(pendingCount()?'（未送信 '+pendingCount()+'）':''), cls:'err'};
    if(pendingCount()) return {k:'pending', txt:'未送信 '+pendingCount()+' 件', cls:'off'};
    const t=S.meta.lastSyncAt? new Date(S.meta.lastSyncAt):null;
    return {k:'ok', txt:'同期済 '+(t? pad2(t.getHours())+':'+pad2(t.getMinutes()) : ''), cls:''};
  }
  function lastError(){ return lastErr; }

  /* リポジトリの中の device-*.json を扱う */
  async function session(){
    const repo=ghRepo();
    let cache=null;
    async function listing(){
      if(cache) return cache;
      const res=await ghFetch('/repos/'+repo+'/contents/'+GH_DIR);
      if(res.status===404){ cache=[]; return cache; }        // まだ1件も置かれていない
      if(!res.ok) throw new Error(ghErrMsg(res));
      const j=await res.json();
      cache=(Array.isArray(j)?j:[])
        .filter(f=> f.type==='file' && DEVFILE_RE.test(f.name))
        .map(f=> ({name:f.name, tag:f.sha, ref:f.sha}));
      return cache;
    }
    return {
      list: listing,
      async read(it){
        const res=await ghFetch('/repos/'+repo+'/git/blobs/'+it.ref, {headers:{'Accept':'application/vnd.github.raw'}});
        if(!res.ok) throw new Error(ghErrMsg(res));
        return JSON.parse(await res.text());
      },
      async write(name, obj){
        const path='/repos/'+repo+'/contents/'+GH_DIR+'/'+name;
        const body={message:'日報データ更新 '+name, content:b64utf8(JSON.stringify(obj))};
        const cur=(await listing()).find(f=>f.name===name);
        if(cur) body.sha=cur.ref;
        let res=await ghFetch(path, {method:'PUT', body:JSON.stringify(body)});
        if(res.status===409 || res.status===422){
          cache=null;                                        // 競合したら一覧を取り直して1回だけやり直す
          const again=(await listing()).find(f=>f.name===name);
          if(again) body.sha=again.ref; else delete body.sha;
          res=await ghFetch(path, {method:'PUT', body:JSON.stringify(body)});
        }
        if(!res.ok) throw new Error(ghErrMsg(res));
        cache=null;
        return await res.json();
      }
    };
  }

  async function run(reason){
    if(busy) return {ok:false, skip:true};
    if(notReady()){ emit(); return {ok:false, skip:true}; }
    if(!navigator.onLine){ emit(); return {ok:false, offline:true}; }
    busy=true; emit();
    const pendingKeys=Object.keys(S.meta.pending||{});
    try{
      const s=await session();
      const myFile='device-'+DEVICE+'.json';

      if(pendingKeys.length){
        await s.write(myFile, exportSnapshot());
        pendingKeys.forEach(k=> delete S.meta.pending[k]);
      }

      const files=await s.list();
      S.meta.peerVer = S.meta.peerVer||{};
      let changed=0, fetched=0;
      for(const it of files){
        if(it.name===myFile) continue;
        if(S.meta.peerVer[it.name]===it.tag) continue;
        const data=await s.read(it);
        changed += importSnapshot(data);
        S.meta.peerVer[it.name]=it.tag;
        fetched++;
      }

      S.meta.lastSyncAt=now(); lastErr='';
      persist(true); busy=false; emit();
      return {ok:true, sent:pendingKeys.length, recv:fetched, changed};
    }catch(e){
      lastErr=(e && e.message) || String(e);
      busy=false; persist(); emit();
      return {ok:false, error:lastErr};
    }
  }

  function schedule(ms){ if(timer) clearTimeout(timer); timer=setTimeout(()=>{ timer=null; run('auto'); }, ms||2500); }
  function start(){
    window.addEventListener('online', ()=>{ emit(); schedule(600); });
    window.addEventListener('offline', ()=> emit());
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) schedule(400); });
    setInterval(()=>{ if(S.meta.autoSync!==false) run('interval'); }, 60000);
    schedule(1200);
  }
  return {run, schedule, start, status, pendingCount, onChange, lastError, configured, notReady, emit};
})();

/* =========================================================================
   別の端末へ設定を引き継ぐリンク
   スマホで長いトークンを打たなくて済むように、保存先とトークンを
   URLの「#」以降に入れたリンクを作る。「#」以降はサーバーへ送られない
   ので、GitHub Pages側にトークンが渡ることはない。
   ========================================================================= */
function makeSetupLink(){
  const payload={r:ghRepo(), t:ghToken()};
  const code=b64utf8(JSON.stringify(payload)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return location.origin+location.pathname+'#setup='+code;
}
/* リンクで開かれたときに設定を取り込む（起動時に1回だけ） */
function consumeSetupLink(){
  const m=(location.hash||'').match(/^#setup=([A-Za-z0-9\-_]+)$/);
  if(!m) return false;
  let applied=false;
  try{
    const json=unb64utf8(m[1].replace(/-/g,'+').replace(/_/g,'/'));
    const p=JSON.parse(json);
    if(p && p.r && p.t){ S.meta.ghRepo=String(p.r); setGhToken(String(p.t)); persist(true); applied=true; }
  }catch(e){}
  /* 履歴やブックマークにトークンが残らないよう、すぐURLから消す */
  try{ history.replaceState(null,'', location.origin+location.pathname+location.search); }
  catch(e){ location.hash=''; }
  return applied;
}

/* ---------------- 画面ヘルパ ---------------- */
let toastTimer=null;
function toast(msg, bad){
  const el=$('#toast'); el.textContent=msg; el.className='toast on'+(bad?' bad':'');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=> el.className='toast', bad?4200:2000);
}
function dialog(title, bodyHTML, buttons){
  $('#mdTitle').textContent=title; $('#mdBody').innerHTML=bodyHTML;
  const f=$('#mdFoot'); f.innerHTML='';
  (buttons||[{t:'閉じる'}]).forEach(b=>{
    const el=document.createElement('button'); el.className='btn '+(b.cls||''); el.textContent=b.t;
    el.onclick=()=>{ if(!b.fn || b.fn()!==false) $('#modal').classList.remove('on'); };
    f.appendChild(el);
  });
  $('#modal').classList.add('on');
}
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on'); });
</script>
<script>
/* =========================================================================
   画面制御
   ========================================================================= */
const UI = { view:'entry', mk:'', staffId:'', date:'', sumTab:'site' };

function setView(v){
  UI.view=v;
  $$('#tabs button').forEach(b=> b.classList.toggle('on', b.dataset.v===v));
  $$('.view').forEach(s=> s.classList.toggle('on', s.id==='v-'+v));
  window.scrollTo(0,0);
  render();
}
$('#tabs').addEventListener('click', e=>{ const b=e.target.closest('button[data-v]'); if(b) setView(b.dataset.v); });

function setMonth(mk){
  UI.mk=mk;
  if(UI.date && UI.date.slice(0,7)!==mk){
    const d=Math.min(parseYmd(UI.date).getDate(), daysInMonth(mk));
    UI.date = mk+'-'+pad2(d);
  }
  render();
}
function shiftMonth(n){
  const [y,m]=UI.mk.split('-').map(Number);
  const d=new Date(y, m-1+n, 1); setMonth(monthKey(d));
}
$('#mPrev').onclick=()=>shiftMonth(-1);
$('#mNext').onclick=()=>shiftMonth(1);
$('#mToday').onclick=()=>{ const t=new Date(); UI.date=ymd(t); setMonth(monthKey(t)); };

/* ---------------- 時刻セレクト ---------------- */
function timeOptions(sel, val, startMin){
  const opts=['<option value="">—</option>'];
  const s=((startMin||0)%1440+1440)%1440;
  for(let i=0;i<48;i++){ const m=(s+i*30)%1440; opts.push(`<option value="${m2t(m)}">${m2t(m)}</option>`); }
  sel.innerHTML=opts.join(''); sel.value=val||'';
}

/* ---------------- 全体レンダリング ---------------- */
let renderLock=false;
function render(){
  if(renderLock) return; renderLock=true;
  try{
    const c=cfg();
    $('#coname').textContent = c.company || 'SAGYO NIPPO SYSTEM';
    $('#mLabel').textContent = jpMonth(UI.mk).replace('令和','R');
    $('#mLabel').title = jpMonthFull(UI.mk);
    renderSyncChip();
    updateSyncBanner();
    if(UI.view==='entry') renderEntry();
    else if(UI.view==='month') renderMonth();
    else if(UI.view==='sum') renderSum();
    else if(UI.view==='print') renderPrintTab();
    else if(UI.view==='admin') renderAdmin();
  } finally { renderLock=false; }
}
function renderSyncChip(){
  const st=Sync.status(); const el=$('#syncChip');
  el.className='syncchip '+(st.cls||''); $('#syncTxt').textContent=st.txt;
}
Sync.onChange(renderSyncChip);
Sync.onChange(updateSyncBanner);
$('#syncChip').onclick=async()=>{
  /* 設定済みならその場で同期、未設定なら設定画面へ */
  if(Sync.configured()){
    toast('同期しています…');
    const r=await Sync.run('manual');
    if(r.ok){ toast(`同期しました（送信 ${r.sent} 件／受信 ${r.recv} 件）`); render(); return; }
    toast('同期できませんでした：'+(r.error||'オフライン'), true);
    if(r.error) openSyncPanel();
    return;
  }
  openSyncPanel();
};

/* ---------------- 同期状況バナー ----------------
   月末（稼働最終日を過ぎている）は今までどおり注意する。それに加えて、月末でなくても
   「この端末に未送信のデータがしばらく（5分以上）たまっている」場合や「同期エラーが
   続いている」場合は、その場で同期を促す注意文を出す（＝端末に貯まったままになるのを防ぐ）。 */
let bannerDismissedOn='';
function updateSyncBanner(){
  const el=$('#syncBanner'); if(!el) return;
  const configured = Sync.configured();
  if(!configured){ el.hidden=true; el.classList.remove('on'); return; }
  const pend=Sync.pendingCount();
  const st=Sync.status();
  if(pend>0){ if(!S.meta.pendingSince){ S.meta.pendingSince=now(); persist(); } }
  else if(S.meta.pendingSince){ S.meta.pendingSince=0; persist(); }
  const pendingMs = pend>0 && S.meta.pendingSince ? (now()-S.meta.pendingSince) : 0;
  const today=ymd(new Date());
  const mk=monthKey(new Date());
  const atOrPastMonthEnd = nearMonthEnd(3);      // 稼働日の残りが3日以内
  const errTrouble = st.k==='error';
  const staleTrouble = pend>0 && pendingMs>5*60*1000;                 // 5分たっても送信できていない
  const monthEndTrouble = atOrPastMonthEnd && (pend>0 || errTrouble);
  const trouble = errTrouble || staleTrouble || monthEndTrouble;
  const dismissKey = today+':'+pend+':'+st.k+':'+(monthEndTrouble?'m':(staleTrouble?'s':'e'));
  const show = trouble && bannerDismissedOn!==dismissKey;
  if(!show){ el.hidden=true; el.classList.remove('on'); return; }
  const jp=jpMonth(mk);
  let msg;
  if(errTrouble){
    msg = monthEndTrouble
      ? `<b>${jp}の同期でエラーが発生しています。月末が近づいています。</b>「管理・設定」で保存先・トークンをご確認のうえ、集計・印刷の前に必ず同期してください。（${st.txt}）`
      : `<b>同期でエラーが発生しています。</b>「管理・設定」で保存先・トークンをご確認のうえ、再同期してください。（${st.txt}）`;
  } else if(monthEndTrouble){
    msg = `<b>月末が近づいています。${jp}の入力に、まだ同期されていないものが ${pend} 件あります。</b>この端末にしか入っていないため、このままでは集計・帳票に反映されません。集計・印刷の前に必ず同期してください。`;
  } else {
    msg = `<b>まだ同期されていない入力が ${pend} 件あります。</b>この端末にしか入っていません。月末までに同期してください（電波の良い場所で、画面右上の同期表示を押してください）。`;
  }
  $('#syncBannerText').innerHTML = msg;
  el.hidden=false; el.classList.add('on');
}
$('#syncBannerBtn').onclick=async()=>{ $('#syncBannerBtn').disabled=true; await Sync.run('banner'); $('#syncBannerBtn').disabled=false; render(); };
$('#syncBannerClose').onclick=()=>{ bannerDismissedOn=ymd(new Date())+':'+Sync.pendingCount()+':'+Sync.status().k; updateSyncBanner(); };

/* ---------------- 作業者セレクト ---------------- */
function needFill(sel){ const k=UI.mk+'#'+masterRev; if(sel.dataset.key===k && sel.options.length) return false; sel.dataset.key=k; return true; }
function fillStaffSelect(sel, val){
  const list=staffForMonth(UI.mk);
  sel.innerHTML = list.length? list.map(s=>`<option value="${s.id}">${esc(s.name)}${s.active===false?'（退職）':''}</option>`).join('')
                             : '<option value="">（社員が未登録です）</option>';
  if(val && list.some(s=>s.id===val)) sel.value=val;
  else if(list.length) sel.value=list[0].id;
}

/* =========================================================================
   ① 日報入力
   ========================================================================= */
let draft=null;   // {staffId,date,start,end,note,entries:[{id,siteId,hours}]}

function loadDraft(){
  const st=UI.staffId, dt=UI.date;
  const d=getDay(st,dt);
  const c=cfg();
  const es=entriesOf(st,dt).map(e=>({id:e.id, siteId:e.siteId, hours:e.hours}));
  draft={ staffId:st, date:dt,
    start: d? (d.start||'') : '', end: d? (d.end||'') : '',
    note: d? (d.note||'') : '',
    entries: es.length? es : [] , _existed: !!(d||es.length),
    /* 保存時、他の端末が入れた分と自分の変更を項目ごとに区別するための「読み込んだ時点」の記録 */
    _origStart: d?(d.start||''):'', _origEnd: d?(d.end||''):'', _origNote: d?(d.note||''):'',
    _origIds: new Set(es.map(e=>e.id)) };
}

/* 画面上部に固定表示する「いま入力している日」の見出し（下へスクロールしても見失わないように） */
function updateStickyBar(){
  const el=$('#dsDate'); if(!el || !draft) return;
  const dt=draft.date, d=parseYmd(dt), w=d.getDay();
  el.innerHTML = `${d.getMonth()+1}月${d.getDate()}日<span class="${w===0?'d-sun':w===6?'d-sat':''}" style="font-size:14px">（${WD[w]}）</span>`;
  $('#dsStaff').textContent = staffName(draft.staffId);
  const flags=[];
  if(isHoliday(dt)) flags.push(`<span class="pill" style="background:#fbeaea;color:#c02626">休日${holidayName(dt)?'：'+esc(holidayName(dt)):''}</span>`);
  else if(isRestDay(dt)) flags.push('<span class="pill" style="background:#fbeaea;color:#c02626">休日</span>');
  if(pendingDates(draft.staffId).has(dt)) flags.push('<span class="pill warn">未同期</span>');
  else if(getDay(draft.staffId,dt) || entriesOf(draft.staffId,dt).length) flags.push('<span class="pill ok">入力済</span>');
  $('#dsFlags').innerHTML=flags.join(' ');
  const tot=draft.entries.reduce((a,e)=>a+num(e.hours),0);
  $('#dsTot').textContent = tot? '合計 '+fx(tot)+' h' : '';
  const rec=getDay(draft.staffId,dt);
  const de=$('#dEdited');
  if(de) de.textContent = rec&&rec._u
    ? '最終更新 '+new Date(rec._u).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})
      + (rec._d===DEVICE? '（この端末）':'（他の端末）') : '';
}
/* 固定見出しがタブの真下に来るように、タブの高さを測ってCSSへ渡す */
function syncNavHeight(){
  const nav=document.querySelector('nav.tabs'); if(!nav) return;
  document.documentElement.style.setProperty('--navh', nav.offsetHeight+'px');
}
window.addEventListener('resize', syncNavHeight);

function renderEntry(){
  const eS=$('#eStaff');
  if(needFill(eS)) fillStaffSelect(eS, UI.staffId);
  if(!UI.staffId || !Array.from(eS.options).some(o=>o.value===UI.staffId)) UI.staffId=eS.value;
  eS.value=UI.staffId;
  updateMyStaffBtn();
  if(!UI.date || UI.date.slice(0,7)!==UI.mk) UI.date = UI.mk+'-'+pad2(Math.min(new Date().getDate(), daysInMonth(UI.mk)));
  $('#eDate').value=UI.date;
  $('#eDate').min=UI.mk+'-01'; $('#eDate').max=UI.mk+'-'+pad2(daysInMonth(UI.mk));

  if(!draft || draft.staffId!==UI.staffId || draft.date!==UI.date) loadDraft();

  syncNavHeight();
  { const c=cfg(); timeOptions($('#eStart'), draft.start, t2m(c.defStart)); timeOptions($('#eEnd'), draft.end, t2m(c.defEnd)); }
  renderCalStrip();
  updateBatchBar();
  renderEntryRows();
  renderNoteChips();
  renderRefPick();
  $('#eNote').value = draft.note||'';
  renderCalc();
  updateStickyBar();
}

/* =========================================================================
   過去の入力を参考にする（当日以前の入力を読み込む）
   ========================================================================= */
function priorDaysWithData(staffId, beforeDate, limit){
  const out=[];
  const dates=Object.keys(S.day).filter(k=>k.startsWith(staffId+'|')).map(k=>S.day[k])
    .filter(d=>!d._x && d.date<beforeDate);
  const withEntry=new Set(live('entry').filter(e=>e.staffId===staffId && e.date<beforeDate).map(e=>e.date));
  const dateSet=new Set(dates.map(d=>d.date)); withEntry.forEach(d=>dateSet.add(d));
  const sorted=Array.from(dateSet).sort().reverse().slice(0, limit||20);
  sorted.forEach(dt=>{
    const r=calcDay(staffId,dt);
    if(!r.total && !r.start && !r.end && !(r.note&&r.note.trim())) return;
    const dw=parseYmd(dt).getDay();
    const sites=r.entries.map(e=>siteName(e.siteId)).join('・');
    const label=`${parseYmd(dt).getMonth()+1}/${parseYmd(dt).getDate()}(${WD[dw]}) ${fx(r.total)||'0.0'}h${sites?' ─ '+sites:''}${r.note?'（'+r.note+'）':''}`;
    out.push({date:dt, label});
  });
  return out;
}
function renderRefPick(){
  const sel=$('#refPick'); if(!sel) return;
  const list=priorDaysWithData(UI.staffId, UI.date, 25);
  sel.innerHTML='<option value="">— 以前の入力から選ぶ —</option>'
    + list.map(x=>`<option value="${x.date}">${esc(x.label)}</option>`).join('');
  $('#refLoad').disabled = !list.length;
  $('#refQuick').disabled = !list.length;
  $('#refQuick').title = list.length? `${list[0].label} を読み込みます` : '参考にできる過去の入力がありません';
}
function loadFromDay(srcDate){
  if(!srcDate) return;
  if(hasEdits() && !confirm('現在の入力内容を上書きします。よろしいですか？')) return;
  const d=getDay(UI.staffId, srcDate);
  const es=entriesOf(UI.staffId, srcDate);
  draft.start = d? (d.start||'') : '';
  draft.end = d? (d.end||'') : '';
  draft.note = d? (d.note||'') : '';
  draft.entries = es.filter(e=>e.siteId&&num(e.hours)).map(e=>({id:uid(), siteId:e.siteId, hours:e.hours}));
  if(!draft.entries.length) draft.entries=[{id:uid(), siteId:'', hours:''}];
  $('#eStart').value=draft.start; $('#eEnd').value=draft.end; $('#eNote').value=draft.note;
  renderEntryRows(); renderCalc(); scheduleAutosave();
  toast(srcDate+' の内容を読み込みました（まもなく自動保存されます）');
}
$('#refLoad').onclick=()=>{ const v=$('#refPick').value; if(!v){ toast('参考にする日を選んでください', true); return; } loadFromDay(v); };
$('#refQuick').onclick=()=>{ const list=priorDaysWithData(UI.staffId, UI.date, 1); if(!list.length){ toast('参考にできる過去の入力がありません', true); return; } loadFromDay(list[0].date); };

/* この端末にだけ保存されていて、まだ送信されていない日を割り出す（カレンダーの●印用） */
function pendingDates(staffId){
  const set=new Set();
  Object.keys(S.meta.pending||{}).forEach(k=>{
    const i=k.indexOf('/'); if(i<0) return;
    const t=k.slice(0,i), id=k.slice(i+1);
    if(t==='day'){
      const p=id.split('|');
      if(p[0]===staffId && p[1]) set.add(p[1]);
    } else if(t==='entry'){
      const r=S.entry[id];
      if(r && r.staffId===staffId && r.date) set.add(r.date);
    }
  });
  return set;
}

function renderCalStrip(){
  const box=$('#calStrip'); const dates=monthDates(UI.mk);
  const first=parseYmd(dates[0]).getDay();
  const unsent=pendingDates(UI.staffId);
  let h = WD.map((w,i)=>`<div class="hd" style="${i===0?'color:#c02626':i===6?'color:#1a63b8':''}">${w}</div>`).join('');
  for(let i=0;i<first;i++) h+='<div class="cd pad"></div>';
  dates.forEach(dt=>{
    const r=calcDay(UI.staffId,dt);
    const rest=isRestDay(dt);
    const has=r.total>0 || !!(r.start&&r.end) || !!(r.note&&r.note.trim());
    const dd=parseYmd(dt).getDate();
    let cls='cd'; if(dt===UI.date) cls+=' sel';
    if(batchDates.has(dt)) cls+=' batchon';
    const w=parseYmd(dt).getDay();
    if(has) cls+=' has'; else if(rest) cls+=' rest'; else if(dt<=ymd(new Date()) && w>=1 && w<=5) cls+=' miss';
    const un=unsent.has(dt); if(un) cls+=' unsent';
    h+=`<button class="${cls}" data-d="${dt}"><span class="dd" style="${w===0||rest?'color:#c02626':w===6?'color:#1a63b8':''}">${dd}</span><br><span class="hh">${r.total? fx(r.total)+'h' : (has?'✓':(rest?'休':''))}</span>${un?'<br><span class="unlbl">未同期</span>':''}</button>`;
  });
  box.innerHTML=h;
}

/* ---------------- 複数日をまとめて入力（モード切替なし） ----------------
   ・ふつうに押す      … その日へ移動（選択中は、押した日を選択に追加／解除）
   ・Shiftを押しながら … いま開いている日から押した日までを、日曜・休日を除いて選択
   ・Ctrl（⌘）を押しながら／スマホの長押し … その日を1日だけ選択に追加・解除 */
let batchDates=new Set();
function toggleBatchDate(dt){
  if(batchDates.has(dt)) batchDates.delete(dt); else batchDates.add(dt);
  renderCalStrip(); updateBatchBar();
}
function selectRange(from, to){
  const a=from<to?from:to, b=from<to?to:from;
  batchDates=new Set();
  monthDates(UI.mk).forEach(d=>{ if(d>=a && d<=b && !isRestDay(d)) batchDates.add(d); });
  batchDates.add(UI.date);          // いま開いている日は休日でも対象に含める
  renderCalStrip(); updateBatchBar();
}
function endBatchSelection(){ batchDates.clear(); renderCalStrip(); updateBatchBar(); }
function updateBatchBar(){
  const bar=$('#batchBar'); if(!bar) return;
  const others=Array.from(batchDates).filter(d=>d!==UI.date);
  bar.hidden = batchDates.size===0;
  if(batchDates.size===0) return;
  const lbl=Array.from(batchDates).sort().map(d=>d.slice(8).replace(/^0/,'')+'日').join('、');
  $('#batchCount').innerHTML = `<b>${batchDates.size} 日を選択中</b>（${esc(lbl)}）　いまの画面の内容を、この日すべてに入力できます`;
  $('#batchApply').disabled = others.length===0;
}
$('#calStrip').addEventListener('click', e=>{
  const b=e.target.closest('.cd[data-d]'); if(!b) return;
  const dt=b.dataset.d;
  if(longPressFired){ longPressFired=false; return; }        // 長押しで選択した直後のクリックは無視
  if(e.shiftKey){ selectRange(UI.date, dt); return; }
  if(e.ctrlKey || e.metaKey){ toggleBatchDate(dt); return; }
  if(batchDates.size){ toggleBatchDate(dt); return; }        // 選択中は、ふつうに押しても追加・解除
  if(!confirmProceedWithSave()) return;
  UI.date=dt; draft=null; render();
});
/* スマホ用：長押しで1日ずつ選択 */
let longPressTimer=null, longPressFired=false;
$('#calStrip').addEventListener('pointerdown', e=>{
  const b=e.target.closest('.cd[data-d]'); if(!b) return;
  const dt=b.dataset.d;
  longPressFired=false;
  if(longPressTimer) clearTimeout(longPressTimer);
  longPressTimer=setTimeout(()=>{
    longPressTimer=null; longPressFired=true;
    toggleBatchDate(dt);
    try{ if(navigator.vibrate) navigator.vibrate(15); }catch(_){}
  }, 450);
});
['pointerup','pointercancel','pointerleave','pointermove'].forEach(ev=>{
  $('#calStrip').addEventListener(ev, ()=>{ if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; } });
});
$('#batchClear').onclick=()=> endBatchSelection();
/* 下書き（draft）と同じ内容を、別の日付へ丸ごと書き込む（既存の内容は置き換える。
   まとめて入力は確認ダイアログで上書きに同意した上での操作なので、start/end/noteの
   3項目とも「今、意図して書き換えた」ものとして扱う） */
function commitDraftToDate(staffId, dt, src){
  const dayId=staffId+'|'+dt;
  const any=(src.start||src.end||src.note||src.entries.some(e=>e.siteId&&num(e.hours)));
  const t=now();
  if(any) put('day', {id:dayId, staffId, date:dt, start:src.start||'', end:src.end||'', note:src.note||'', _uf:{start:t,end:t,note:t}});
  else if(S.day[dayId] && !S.day[dayId]._x) del('day', dayId);
  entriesOf(staffId,dt).forEach(e=> del('entry', e.id));
  src.entries.forEach(e=>{ if(!e.siteId||!num(e.hours)) return;
    put('entry', {id:uid(), staffId, date:dt, siteId:e.siteId, hours:h1(e.hours)}); });
}
$('#batchApply').onclick=()=>{
  if(!draft){ toast('先に現在の日の内容を入力してください', true); return; }
  const bad=draft.entries.find(e=> !e.siteId && num(e.hours)>0);
  if(bad){ toast('時間を入れた行に現場が選ばれていません', true); return; }
  const targets=Array.from(batchDates).filter(dt=>dt!==draft.date).sort();
  if(!targets.length){ toast('反映先の日を選んでください（現在の日以外）', true); return; }
  const src={start:draft.start, end:draft.end, note:draft.note, entries:draft.entries.filter(e=>e.siteId&&num(e.hours))};
  const existing=targets.filter(dt=> getDay(draft.staffId,dt) || entriesOf(draft.staffId,dt).length);
  const finish=(n,skipped)=>{
    persist(true); Sync.schedule(1500); endBatchSelection();
    toast(skipped? `${n} 日に入力しました（入力済みの${skipped}日は除く）` : `${n} 日に入力しました`);
    render();
  };
  const applyAll=()=>{
    commitDraft(true);
    targets.forEach(dt=> commitDraftToDate(draft.staffId, dt, src));
    finish(targets.length);
  };
  if(existing.length){
    dialog('上書きの確認',
      `<p>選択した ${targets.length} 日のうち、既に入力済みの日が ${existing.length} 日あります（${existing.map(d=>d.slice(5)).join('、')}）。<br>上書きしてよろしいですか？</p>`,
      [
        {t:'キャンセル'},
        {t:'未入力の日にだけ入力', fn:()=>{
          const only=targets.filter(dt=>existing.indexOf(dt)<0);
          commitDraft(true);
          only.forEach(dt=> commitDraftToDate(draft.staffId, dt, src));
          finish(only.length, existing.length);
        }},
        {t:'上書きする', cls:'primary', fn:applyAll}
      ]);
  } else applyAll();
};

function renderEntryRows(){
  const box=$('#entList'); const activeSites=siteList();
  if(!draft.entries.length) draft.entries=[{id:uid(), siteId:'', hours:''}];
  box.innerHTML = draft.entries.map((e,i)=>{
    const closed = e.siteId && !activeSites.some(s=>s.id===e.siteId);
    const label = e.siteId ? esc(siteName(e.siteId))+(closed?'（終了）':'') : '<span class="ph">— 現場を選択 —</span>';
    return `<div class="ent" data-i="${i}">
      <button type="button" class="es sitebtn" data-i="${i}">${label}<span class="arrow">▾</span></button>
      <div class="hbox"><button data-m="-0.5">−</button><input class="eh" type="number" step="0.5" min="0" max="24" value="${e.hours===''||e.hours==null?'':e.hours}" inputmode="decimal" placeholder="時間"><button data-m="0.5">＋</button></div>
      <button class="del" title="削除">✕</button></div>`;
  }).join('');
  $('#entCount').textContent = `合計 ${fx(draft.entries.reduce((a,e)=>a+num(e.hours),0))||'0.0'} 時間 / ${draft.entries.filter(e=>e.siteId).length} 現場`;
}

/* 入力した作業内容を、その人の候補として自動的に覚える（保存の確定時だけ） */
const CHIP_MAX=30;
function learnNoteChips(staffId, note){
  const txt=String(note||'').trim(); if(!txt) return;
  const s=S.staff[staffId]; if(!s || s._x) return;
  const parts=txt.split(/[・、,，\n\r]+/).map(x=>x.trim()).filter(x=> x && x.length<=20);
  if(!parts.length) return;
  const list=(chipsFor(staffId)||[]).slice();
  let changed=false;
  parts.forEach(t=>{ if(list.indexOf(t)<0){ list.push(t); changed=true; } });
  if(!changed) return;
  while(list.length>CHIP_MAX) list.shift();
  put('staff', Object.assign({}, s, {chips:list}));
}

/* 保存確認：未保存の変更があるときに移動しようとしたら「保存しますか？」と聞き、
   はい（OK）なら保存してから移動、キャンセルならこの画面にとどまる */
function confirmProceedWithSave(){
  if(!hasEdits()) return true;
  const bad=draft.entries.find(e=> !e.siteId && num(e.hours)>0);
  if(bad){
    return confirm('時間を入れた行に現場が選ばれていないため、このままでは保存できません。\n保存せずに移動しますか？（この行の内容は失われます）');
  }
  if(confirm('保存しますか？\n\n［OK］保存してから移動します\n［キャンセル］この画面にとどまります')){
    commitDraft(true);
    return true;
  }
  return false;
}
/* 未保存判定 */
function hasEdits(){
  if(!draft) return false;
  const d=getDay(draft.staffId,draft.date);
  const cur={start:d?d.start||'':'', end:d?d.end||'':'', note:d?d.note||'':''};
  if(cur.start!==(draft.start||'')||cur.end!==(draft.end||'')||cur.note!==(draft.note||'')) return true;
  const old=entriesOf(draft.staffId,draft.date).map(e=>e.siteId+':'+num(e.hours)).sort().join('|');
  const nw=draft.entries.filter(e=>e.siteId&&num(e.hours)).map(e=>e.siteId+':'+num(e.hours)).sort().join('|');
  return old!==nw;
}
/* 下書き（draft）の内容をS（永続データ）へ書き込む。画面や入力中のフォーカスは変更しない。
   同じ日を他の端末が自分より先に直していた場合でも、その内容を消してしまわないよう、
   ①始業・終業・備考は「自分が実際に触った項目だけ」を書き込み、触っていない項目は
     読み込んだあとに他の端末から届いた最新の内容をそのまま残す。
   ②現場明細（entries）は、下書きを開いた時点に存在した行だけを削除の対象にする。
     開いたあとに他の端末が追加した行は、自分がまだ知らないだけなので消さない
     （＝次にこの日を開き直すと両方の内容が見える）。 */
function commitDraft(final){
  if(!draft || !draft.staffId) return false;
  const st=draft.staffId, dt=draft.date;
  const bad=draft.entries.find(e=> !e.siteId && num(e.hours)>0);
  if(bad) return false;
  const dayId=st+'|'+dt;

  const liveDay=getDay(st,dt);
  const liveVal={start:liveDay?liveDay.start||'':'', end:liveDay?liveDay.end||'':'', note:liveDay?liveDay.note||'':''};
  const liveUf=liveDay&&liveDay._uf||{};
  const orig={start:draft._origStart||'', end:draft._origEnd||'', note:draft._origNote||''};
  const mine={start:draft.start||'', end:draft.end||'', note:draft.note||''};
  const tsNow=now();
  const val={}, uf={};
  ['start','end','note'].forEach(k=>{
    if(mine[k]!==orig[k]){ val[k]=mine[k]; uf[k]=tsNow; }              // 自分がこの項目を変更した
    else { val[k]=liveVal[k]; uf[k]=liveUf[k]!=null?liveUf[k]:(liveDay?liveDay._u:0)||0; } // 触っていない→最新を維持
  });

  const any = (val.start||val.end||val.note||draft.entries.some(e=>e.siteId&&num(e.hours)));
  if(any) put('day', {id:dayId, staffId:st, date:dt, start:val.start, end:val.end, note:val.note, _uf:uf});
  else if(S.day[dayId] && !S.day[dayId]._x) del('day', dayId);

  const origIds=draft._origIds||new Set();
  const keep={};
  draft.entries.forEach(e=>{
    if(!e.siteId || !num(e.hours)) return;
    keep[e.id]=1;
    put('entry', {id:e.id, staffId:st, date:dt, siteId:e.siteId, hours:h1(e.hours)});
  });
  entriesOf(st,dt).forEach(e=>{ if(origIds.has(e.id) && !keep[e.id]) del('entry', e.id); });
  /* 入力が確定したとき（保存ボタン・日付や作業者の切り替え・画面を離れるとき）だけ、
     作業内容をその人の候補として覚える（入力の途中の文字を覚えてしまわないように） */
  if(final) learnNoteChips(st, val.note);
  persist(true);
  Sync.schedule(1500);
  return true;
}
/* 保存（ボタン／Ctrl+S）：この端末へ保存し、つながっていればその場で同期する */
async function saveDraft(){
  if(!draft || !draft.staffId){ toast('作業者を選択してください', true); return false; }
  const bad=draft.entries.find(e=> !e.siteId && num(e.hours)>0);
  if(bad){ toast('時間を入れた行に現場が選ばれていません', true); return false; }
  commitDraft(true);
  const btn=$('#eSave');
  if(!Sync.configured()){
    toast('この端末に保存しました'); draft=null; render(); return true;
  }
  if(!navigator.onLine){
    toast('この端末に保存しました（電波が戻ると自動で送信します）'); draft=null; render(); return true;
  }
  const label=btn? btn.textContent : '';
  if(btn){ btn.disabled=true; btn.textContent='同期しています…'; }
  const r=await Sync.run('save');
  if(btn){ btn.disabled=false; btn.textContent=label||'保存して同期'; }
  if(r.ok) toast(`保存して同期しました（送信 ${r.sent} 件／受信 ${r.recv} 件）`);
  else if(r.offline) toast('この端末に保存しました（電波が戻ると自動で送信します）');
  else toast('この端末に保存しました。同期はできませんでした：'+(r.error||''), true);
  draft=null; render();
  return true;
}
/* 自動保存：入力が止まってしばらくしたら、フォームはそのままに裏で保存する */
let autosaveTimer=null;
function scheduleAutosave(){
  if(autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer=setTimeout(()=>{
    autosaveTimer=null;
    if(!draft || !draft.staffId || !hasEdits()) return;
    const bad=draft.entries.find(e=> !e.siteId && num(e.hours)>0);
    if(bad) return; // 現場未選択のまま時間だけ入っている間は待つ
    if(commitDraft()) refreshDayFlags();
  }, 1200);
}
/* 入力済み表示・最終更新時刻だけを更新（フォーカス中の入力欄には触れない） */
function refreshDayFlags(){
  if(!draft || UI.view!=='entry') return;
  updateStickyBar();
  renderCalStrip();
}
$('#eSave').onclick=()=>saveDraft();
/* 備考の入力を終えて他へ移ったときに、確定として保存する（＝候補として覚える）。
   候補ボタンを押したときは、まだ入力の途中なので覚えない */
$('#eNote').addEventListener('blur', (e)=>{
  if(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('#noteChips')) return;
  if(!draft || !draft.staffId || !hasEdits()) return;
  const bad=draft.entries.find(e=> !e.siteId && num(e.hours)>0);
  if(bad) return;
  if(commitDraft(true)) refreshDayFlags();
});

function renderCalc(){
  const c=cfg();
  const total=Math.round(draft.entries.reduce((a,e)=>a+num(e.hours),0)*100)/100;
  const rest=isRestDay(draft.date);
  const night=nightHours(draft.start,draft.end);
  const std=c.stdHours||7;
  let kitei=0,over=0,hol=0;
  if(rest) hol=Math.max(0,Math.round((total-night)*100)/100);
  else { kitei=Math.min(total,std); if(total>std) over=Math.max(0,Math.round((total-std-night)*100)/100); }
  const cells=[['合計',total,'t-sum'],['所定',kitei,'t-kt'],['時間外',over,'t-ot'],['深夜',night,'t-nt'],['休日',hol,'t-hd']];
  $('#calcBox').innerHTML = cells.map(([k,v,cl])=>
    `<div class="${cl}${v?'':' zero'}"><div class="k">${k}</div><div class="v">${v? fx(v):'0.0'}</div></div>`).join('')
    + '<div class="fill"></div>';
  const msgs=[];
  if(draft.start&&draft.end){ let s=t2m(draft.start),e=t2m(draft.end); if(e<=s)e+=1440;
    msgs.push(`拘束 ${fx((e-s)/60)} 時間（休憩を除いた作業時間を現場ごとに入力してください）`); }
  if(total>std && !rest) msgs.push(`所定 ${std} 時間を超えた分は時間外に計上されます。`);
  if(rest) msgs.push('この日は休日のため、全時間を「休日」に計上します。');
  if(!total && (draft.start||draft.end)) msgs.push('現場ごとの作業時間がまだ入力されていません。');
  $('#calcNote').textContent = msgs.join('　');
  updateStickyBar();
}
</script>
<script>

  $('#monthTable').innerHTML=h;
  $('#mWarn').innerHTML = miss? `<span class="pill warn">未入力の平日 ${miss} 日</span>` : `<span class="pill ok">未入力なし</span>`;
}

function renderSum(){
  $$('#v-sum .chip').forEach(b=>{ const on=b.dataset.s===UI.sumTab;
    b.style.background=on?'#12395c':''; b.style.color=on?'#fff':''; b.style.borderColor=on?'#12395c':''; });
  const mk=UI.mk, box=$('#sumBox');
  if(UI.sumTab==='site') box.innerHTML=tblSiteMatrix(mk);
  else if(UI.sumTab==='staff') box.innerHTML=tblStaffMatrix(mk);
  else box.innerHTML=tblCheck(mk);
}
$('#v-sum').addEventListener('click', e=>{ const b=e.target.closest('.chip[data-s]'); if(b){ UI.sumTab=b.dataset.s; renderSum(); } });

function tblSiteMatrix(mk){
  const staff=staffForMonth(mk), used=sitesUsed(null,mk);
  if(!used.length) return '<div class="empty">この月の実績はまだありません</div>';
  const m={}; entriesOfMonth(mk).forEach(e=>{ (m[e.siteId]=m[e.siteId]||{})[e.staffId]=((m[e.siteId]||{})[e.staffId]||0)+num(e.hours); });
  let h='<table class="gr"><thead><tr><th class="l">現場名</th>'+
    staff.map(s=>`<th>${esc(s.name)}</th>`).join('')+'<th>計</th></tr></thead><tbody>';
  const colT={}; let gT=0;
  used.forEach(id=>{
    let rt=0;
    h+=`<tr><td class="l">${esc(siteName(id))}</td>`;
    staff.forEach(s=>{ const v=(m[id]||{})[s.id]||0; rt+=v; colT[s.id]=(colT[s.id]||0)+v;
      h+=`<td class="${v?'':'num0'}">${fx(v)||'·'}</td>`; });
    gT+=rt; h+=`<td style="font-weight:700">${fx(rt)}</td></tr>`;
  });
  h+=`</tbody><tfoot><tr><td class="l">計</td>${staff.map(s=>`<td>${fx(colT[s.id])||'·'}</td>`).join('')}<td>${fx(gT)}</td></tr></tfoot></table>`;
  return h;
}
function tblStaffMatrix(mk){
  const staff=staffForMonth(mk), dates=monthDates(mk);
  if(!staff.length) return '<div class="empty">社員が登録されていません</div>';
  let h='<table class="gr"><thead><tr><th class="l">氏名</th><th>区分</th>'+
    dates.map(d=>{ const w=parseYmd(d).getDay(); return `<th class="${w===0||isRestDay(d)?'d-sun':w===6?'d-sat':''}">${parseYmd(d).getDate()}</th>`;}).join('')+
    '<th>合計</th></tr></thead><tbody>';
  const kinds=[['所定','kitei'],['時間外','over'],['深夜','night'],['休日','hol']];
  staff.forEach(s=>{
    const mc=monthCalc(s.id,mk);
    kinds.forEach(([lab,key],i)=>{
      h+=`<tr>${i===0?`<td class="l" rowspan="4" style="font-weight:700;vertical-align:middle">${esc(s.name)}</td>`:''}<td>${lab}</td>`;
      dates.forEach(d=>{ const v=mc.days[d][key]; h+=`<td class="${v?'':'num0'}">${fx(v)||'·'}</td>`; });
      h+=`<td style="font-weight:700">${fx(mc.total[key])||'·'}</td></tr>`;
    });
  });
  return h+'</tbody></table>';
}
function tblCheck(mk){
  const staff=staffForMonth(mk), c=cfg(), today=ymd(new Date());
  const rows=[];
  staff.forEach(s=>{
    monthDates(mk).forEach(dt=>{
      const r=calcDay(s.id,dt); const rest=isRestDay(dt);
      const wd=parseYmd(dt).getDay();
      if(!rest && !r.total && !(r.note&&r.note.trim()) && dt<=today && wd>=1 && wd<=5) rows.push([s.name,dt,'未入力','平日ですが入力がありません','warn']);
      else if(!rest && r.total && r.total<(c.stdHours||7)) rows.push([s.name,dt,'時間不足',`合計 ${fx(r.total)} 時間（所定 ${c.stdHours}）`,'warn']);
      else if(r.total>16) rows.push([s.name,dt,'時間過大',`合計 ${fx(r.total)} 時間`,'bad']);
      if(r.total && !r.start && !r.end) rows.push([s.name,dt,'時刻未入力','始業・終業が空欄です','warn']);
    });
  });
  if(!rows.length) return '<div class="empty">✓ 問題は見つかりませんでした</div>';
  return '<table class="gr"><thead><tr><th class="l">氏名</th><th>日付</th><th>種別</th><th class="l">内容</th></tr></thead><tbody>'+
    rows.map(r=>`<tr data-s="${esc(r[0])}" data-d="${r[1]}"><td class="l">${esc(r[0])}</td><td>${r[1].slice(5)}</td>
      <td><span class="pill ${r[4]==='bad'?'':'warn'}">${r[2]}</span></td><td class="l">${esc(r[3])}</td></tr>`).join('')+
    `</tbody></table><div class="hint" style="padding:10px 14px">合計 ${rows.length} 件</div>`;
}
$('#csvBtn').onclick=()=>{
  const mk=UI.mk; const rows=[['氏名','日付','曜日','始業','終業','所定','時間外','深夜','休日','現場','時間','作業内容']];
  staffForMonth(mk).forEach(s=> monthDates(mk).forEach(dt=>{
    const r=calcDay(s.id,dt); if(!r.total && !r.start && !r.note) return;
    if(!r.entries.length) rows.push([s.name,dt,WD[parseYmd(dt).getDay()],r.start,r.end,r.kitei,r.over,r.night,r.hol,'','',r.note||'']);
    r.entries.forEach(e=> rows.push([s.name,dt,WD[parseYmd(dt).getDay()],r.start,r.end,r.kitei,r.over,r.night,r.hol,siteName(e.siteId),e.hours,r.note||'']));
  }));
  const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  downloadBlob(csv,'text/csv;charset=utf-8', `作業日報_${mk}.csv`);
};
function downloadBlob(data, mime, name){
  const b=new Blob([data],{type:mime}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u); a.remove();},400);
}
</script>

/* アプリを開いているURL（GitHub Pages）から、データ用リポジトリ名の候補を作る。
   例）https://tutuken0117.github.io/sagyounippou/ → tutuken0117/sagyounippou-data
   ※ アプリを置く公開リポジトリと、データを置く非公開リポジトリは必ず別にする（Pagesの無料利用には
   公開リポジトリが必要なため、同じリポジトリにデータを置くと社員名・勤務時間が誰でも見えてしまう） */
function suggestDataRepo(){
  try{
    const h=location.hostname;
    if(!/\.github\.io$/i.test(h)) return '';
    const user=h.replace(/\.github\.io$/i,'');
    const repo=(location.pathname||'').split('/').filter(Boolean)[0]||'';
    if(!user||!repo) return '';
    return user+'/'+repo+'-data';
  }catch(e){ return ''; }
}

function staffRow(s,i,n){

function siteRow(s,i,n){

    <button class="btn sm danger" data-del="1">削除</button></div>`;

function reorder(type, id, dir){
  const list=(type==='staff'?staffList(true):siteList(true));
  const i=list.findIndex(x=>x.id===id); const j=i+dir;
  if(i<0||j<0||j>=list.length) return;
  const a=list[i], b=list[j];
  put(type, Object.assign({}, a, {ord:j})); put(type, Object.assign({}, b, {ord:i}));
  list.forEach((x,k)=>{ if(k!==i && k!==j && x.ord!==k) put(type,Object.assign({},x,{ord:k})); });
  renderAdmin(); Sync.schedule();
}
function bindAdmin(){
  $$('#adminBox h3.acc').forEach(h=>{
    h.onclick=()=>{ const k=h.dataset.acc; adminOpen[k]=!adminOpen[k]; renderAdmin(); };
  });
  $('#addStaff').onclick=()=>{ const v=$('#newStaff').value.trim(); if(!v) return;
    put('staff',{id:uid(), name:v, ord:staffList(true).length, active:true}); $('#newStaff').value=''; renderAdmin(); Sync.schedule(); toast('社員を追加しました'); };
  $('#newStaff').onkeydown=e=>{ if(e.key==='Enter') $('#addStaff').click(); };
  $('#addSite').onclick=()=>{ const v=$('#newSite').value.trim(); if(!v) return;
    put('site',{id:uid(), name:v, ord:siteList(true).length, active:true, createdAt:now()}); $('#newSite').value=''; renderAdmin(); Sync.schedule(); toast('現場を追加しました'); };
  $('#newSite').onkeydown=e=>{ if(e.key==='Enter') $('#addSite').click(); };

  ['staff','site'].forEach(type=>{
    const el=$('#'+type+'List'); if(!el) return;
    el.addEventListener('click', e=>{
      const it=e.target.closest('.it'); if(!it) return; const id=it.dataset.id;
      if(e.target.dataset.mv) reorder(type,id,+e.target.dataset.mv);
      if(e.target.dataset.del){
        const used = type==='staff'
          ? live('entry').some(x=>x.staffId===id)||live('day').some(x=>x.staffId===id)
          : live('entry').some(x=>x.siteId===id);
        if(used){ dialog('削除できません',
          `<p>この${type==='staff'?'社員':'現場'}には実績データがあるため削除できません。<br>代わりに「${type==='staff'?'在籍':'稼働中'}」のチェックを外してください。過去の帳票はそのまま残り、今後の選択肢から外れます。</p>`); return; }
        if(confirm('削除します。よろしいですか？')){ del(type,id); renderAdmin(); Sync.schedule(); }

function renderHolCal(){
  const box=$('#holCal'); if(!box) return;
  const dates=monthDates(UI.mk); const first=parseYmd(dates[0]).getDay();
  let h=WD.map((w,i)=>`<div class="hd" style="${i===0?'color:#c02626':i===6?'color:#1a63b8':''}">${w}</div>`).join('');
  for(let i=0;i<first;i++) h+='<div class="cd pad"></div>';
  dates.forEach(dt=>{
    const rec=holidayRec(dt), pub=jpHolidayName(dt);
    const hol=isHoliday(dt), w=parseYmd(dt).getDay(), rest=isRestDay(dt);
    const worked = !!(rec && rec.work);
    const label = worked? '出勤' : (holidayName(dt) || (hol?'休日':''));
    h+=`<button class="cd ${rest?'rest':''}" data-h="${dt}" title="${esc(label)}"
        style="${hol?'background:#fbeaea;border-color:#e6b8b8':(worked?'background:#eef5fc;border-color:#c8ddf1':'')}">
      <span class="dd" style="${w===0||rest?'color:#c02626':w===6?'color:#1a63b8':''}">${parseYmd(dt).getDate()}</span>
      <br><span class="hh" style="font-size:9px;${pub&&hol?'color:#c02626':''}">${esc(label.length>4? label.slice(0,4):label)}</span></button>`;
  });
  box.innerHTML=h;
  box.onclick=e=>{
    const b=e.target.closest('.cd[data-h]'); if(!b) return; const dt=b.dataset.h;
    const rec=holidayRec(dt), pub=!!jpHolidayName(dt);
    if(rec && rec.work) del('holiday',dt);           // 出勤指定を解除（祝日に戻る）
    else if(pub) put('holiday',{id:dt, work:true});  // 祝日だが出勤する日にする
    else if(rec) del('holiday',dt);                  // 会社休日 → 平日
    else put('holiday',{id:dt, name:''});            // 平日 → 会社休日
    renderHolCal(); Sync.schedule(); render();
  };
}

/* 会社カレンダーの日付をまとめて登録する */
function openHolidayImport(){
  const body=`
    <p class="hint" style="margin:0 0 10px">会社カレンダーの休みの日を、1行に1つずつ貼り付けてください。<br>
    <code>2027/4/10</code> <code>2027-04-10</code> <code>4/10</code>（${UI.mk.slice(0,4)}年として扱います）などの書き方に対応しています。
    日付のうしろに名前を書くと、その名前で登録します（例：<code>2027/8/13 盆休み</code>）。</p>
    <textarea id="holImpText" style="min-height:180px" placeholder="2027/4/10&#10;2027/5/2 会社休日&#10;2027/8/13 盆休み"></textarea>
    <p class="hint" id="holImpInfo" style="margin:8px 0 0"></p>`;
  dialog('休日をまとめて登録', body, [
    {t:'キャンセル'},
    {t:'登録する', cls:'primary', fn:()=>{
      const txt=$('#holImpText').value||'';
      const {ok, bad}=importHolidayText(txt);
      if(!ok){ $('#holImpInfo').innerHTML='<b style="color:#c02626">読み取れる日付がありませんでした。</b>'; return false; }
      toast(`${ok} 日を休日に登録しました${bad?`（${bad} 行は読み取れませんでした）`:''}`);
      Sync.schedule(); renderAdmin();
    }}
  ]);
}
function importHolidayText(txt){
  const yearHint=+UI.mk.slice(0,4);
  let ok=0, bad=0;
  String(txt).split(/[\r\n]+/).forEach(line=>{
    const s=line.trim(); if(!s) return;
    const m=s.match(/(?:(\d{4})\s*[-/年.]\s*)?(\d{1,2})\s*[-/月.]\s*(\d{1,2})\s*日?/);
    if(!m){ bad++; return; }
    const y=m[1]? +m[1] : yearHint;
    const mo=+m[2], d=+m[3];
    if(!(mo>=1&&mo<=12&&d>=1&&d<=31)){ bad++; return; }
    const dt=y+'-'+pad2(mo)+'-'+pad2(d);
    if(parseYmd(dt).getDate()!==d){ bad++; return; }   // 存在しない日付
    const name=s.slice(m.index+m[0].length).replace(/^[\s,、:：（(]+/,'').replace(/[)）]\s*$/,'').trim();
    put('holiday',{id:dt, name:name||''});
    ok++;
  });
  if(ok) persist(true);
  return {ok, bad};
}

const SITE_ROWS_PER_PAGE = 36, STAFF_PER_PAGE = 8;
function chunk(arr,n){ const o=[]; for(let i=0;i<Math.max(1,Math.ceil(arr.length/n));i++) o.push(arr.slice(i*n,(i+1)*n)); return o; }

function sheetSiteMatrix(){
  const mk=UI.mk; const staff=staffForMonth(mk).filter(s=> monthCalc(s.id,mk).total.total>0);
